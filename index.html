button{cursor:pointer;border:1px solid #aebfd0;background:#fff;color:#203349;border-radius:10px;padding:9px 13px}

.primary{background:#2469b2;color:#fff;border-color:#2469b2}
.progress{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.progress span{border:1px solid #d5e0ea;border-radius:999px;padding:5px 10px;font-size:.83rem}

.product{display:flex;gap:9px;align-items:flex-start;min-width:0;border:1px solid #d7e1eb;border-radius:12px;padding:11px;cursor:pointer}
.product:has(input:checked){background:#edf6ff;border-color:#4f8bc6}
.product:has(input:disabled){opacity:.55;cursor:not-allowed}
.product input{margin-top:5px;width:19px;height:19px;accent-color:#2266bb;flex-shrink:0}
.product-info{display:block;flex:1;min-width:0}
.product-name,.details{display:block;overflow-wrap:anywhere}

.details{font-size:.82rem;color:#52677c;line-height:1.5}
.stars{display:block;color:#895400;font-size:.8rem;margin-top:4px}
.emoji{font-size:1.25rem;margin-right:4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:#f2f6fa;border-radius:9px;padding:8px 10px;min-width:0}
.stat>span{display:block;font-size:.76rem;color:#55697d}

.calorie-meter strong{position:relative;z-index:1;display:block;padding:6px 8px}
.goal{background:#fff2c9;border-radius:9px;padding:8px 11px;margin:9px 0;font-size:.87rem;font-weight:700}
.goal.reached{background:#e6f5ec;color:#176747}

.table-wrap{overflow-x:auto;border-radius:10px}

function total(ids){
 const r={kcal:0,cents:0,stars:0,days:Infinity,count:ids.length,ids:[...ids]};
 ids.forEach(id=>{const p=products[id];if(p){r.kcal+=p.kcal;r.cents+=p.cents;r.stars+=p.stars;r.days=Math.min(r.days,p.days)}});
 if(!Number.isFinite(r.days))r.days=0;return r;
}
function progress(id){
 const box=$(id);box.replaceChildren();
 t().levels.forEach((_,i)=>{const s=document.createElement("span");s.textContent=i===4?"Bonus":"Level "+(i+1);if(i<level)s.className="done";if(i===level)s.className="current";box.appendChild(s)});
}
function applyLanguage(){
 const x=t();
 document.documentElement.lang=currentLanguage;
 document.documentElement.dir=currentLanguage==="ar"?"rtl":"ltr";
 $("pageTitle").textContent=x.page;
 document.querySelectorAll(".language-buttons button").forEach(b=>{const active=b.dataset.language===currentLanguage;b.classList.toggle("active",active);b.setAttribute("aria-pressed",String(active))});
 $("startButton").textContent=x.start;$("productsHeading").textContent=x.products;
 $("calorieLabel").textContent=x.calories;$("priceLabel").textContent=x.price;$("starsLabel").textContent=x.stars;$("countLabel").textContent=x.count;
 $("clearButton").textContent=x.clear;$("hintLabel").textContent=x.hint;$("hintFloat").setAttribute("aria-label",x.hintAria);
 $("nameHeading").textContent=x.nameHeading;$("nameInstructions").textContent=x.nameInstructions;$("nameLabel").textContent=x.nameLabel;$("playerName").placeholder=x.namePlaceholder;$("submitScore").textContent=x.save;
 $("finalHeading").textContent=x.final;$("finalInstructions").textContent=x.finalInstructions;$("summaryHeading").textContent=x.summary;$("leaderboardHeading").textContent=x.leaderboard;
 if(!$("startScreen").hidden)renderStart();
 if(!$("game").hidden){$("gameHeading").textContent=x.levels[level][0];$("nextButton").textContent=level===4?x.bonus:x.next;renderGame()}
 if(!$("finalScreen").hidden){renderOwnSummary();renderFinalMenus();loadLeaderboard()}
}
function renderStart(){
 const x=t();$("levelTitle").textContent=x.levels[level][0];$("task").textContent="❗ "+x.levels[level][1];progress("startProgress");
 $("startScreen").hidden=false;$("game").hidden=true;$("actionBar").hidden=true;$("hintFloat").hidden=true;$("hintPopup").hidden=true;$("nameGate").hidden=true;$("finalScreen").hidden=true;
}
function renderProducts(){
 const x=t(),box=$("products"),sum=total([...selected]);box.replaceChildren();
 products.forEach((p,i)=>{
  const label=document.createElement("label");label.className="product";
  const input=document.createElement("input");input.type="checkbox";input.checked=selected.has(i);input.disabled=!input.checked&&sum.kcal+p.kcal>MAX;
  input.addEventListener("change",()=>{if(input.checked)selected.add(i);else selected.delete(i);renderProducts();renderSummary()});
  const icon=document.createElement("span");icon.className="emoji";icon.textContent=p.icon;
  const info=document.createElement("span");info.className="product-info";
  const name=document.createElement("span");name.className="product-name";name.textContent=x.products[i];
  const details=document.createElement("span");details.className="details";details.textContent=p.kcal+" "+x.calories+" · "+money(p.cents)+" · "+x.shelf+" "+p.days+" "+x.days;
  const stars=document.createElement("span");stars.className="stars";stars.textContent=x.health+" "+"★".repeat(p.stars)+"☆".repeat(5-p.stars);
  info.append(name,details,stars);label.append(input,icon,info);box.appendChild(label);
 });
}
function renderSummary(){
 const x=t(),r=total([...selected]);
 $("calories").textContent=r.kcal+" "+x.calories;$("calorieFill").style.width=Math.min(100,r.kcal/MAX*100)+"%";$("calorieFill").style.backgroundColor=r.kcal>=MIN?"#79bd83":"#f2bd57";$("calorieMeter").setAttribute("aria-valuenow",r.kcal);
 $("price").textContent=money(r.cents);$("stars").textContent=r.stars+" ★";$("count").textContent=r.count;
 const goal=$("goal");
 if(r.kcal>=MIN&&r.kcal<=MAX){goal.textContent=x.goal;goal.classList.add("reached")}
 else if(r.kcal<MIN){goal.textContent=x.short+(MIN-r.kcal)+x.until;goal.classList.remove("reached")}
 else{goal.textContent=x.tooMany;goal.classList.remove("reached")}
}
function renderGame(){
 $("gameHeading").textContent=t().levels[level][0];$("hintPopup").hidden=true;$("hintFloat").hidden=false;$("hintFloat").setAttribute("aria-expanded","false");
 $("nextButton").textContent=level===4?t().bonus:t().next;progress("progress");renderProducts();renderSummary();
}
function bestFor(n){
 if(Object.prototype.hasOwnProperty.call(solutionCache,n))return solutionCache[n];
 const valid=[];
 for(let mask=1;mask<(1<<products.length);mask++){
  const ids=[];for(let i=0;i<products.length;i++)if(mask&(1<<i))ids.push(i);
  if(n===4&&ids.includes(2))continue;
  const r=total(ids);if(r.kcal>=MIN&&r.kcal<=MAX)valid.push(r);
 }
 if(!valid.length)return solutionCache[n]=null;
 if(n===0||n===2){const close=valid.filter(x=>x.kcal>=525&&x.kcal<=575),choices=close.length?close:valid;return solutionCache[n]=choices.reduce((a,b)=>b.stars*1000-Math.abs(b.kcal-550)>a.stars*1000-Math.abs(a.kcal-550)?b:a)}
 const score=x=>n===1?-x.cents:n===3?x.days:(x.stars/x.count/5+Math.min(x.days,30)/30+(1-x.cents/500))/3;
 return solutionCache[n]=valid.reduce((a,b)=>score(b)>score(a)?b:a);
}
function similarity(ids,solution){
 if(!solution)return 0;const chosen=new Set(Array.isArray(ids)?ids:[]),target=new Set(solution.ids),union=new Set([...chosen,...target]);let common=0;chosen.forEach(id=>{if(target.has(id))common++});return union.size?common/union.size:1;
}
function cell(text,className=""){const c=document.createElement("td");if(className)c.className=className;c.textContent=text;return c}
function headers(){
 const x=t(),r=document.createElement("tr");
 [x.levelCol,x.productCol,x.calorieCol,x.priceCol,x.starsCol,x.shelfCol].forEach(v=>{const th=document.createElement("th");th.textContent=v;r.appendChild(th)});return r;
}
function appendResultRow(body,label,ids,name=""){
 const x=t(),safe=Array.isArray(ids)?ids.filter(i=>Number.isInteger(i)&&products[i]):[],r=total(safe),row=document.createElement("tr");
 row.append(cell(label+(name?" — "+name:""),"products-cell"),cell(safe.map(i=>x.products[i]).join(", ")||x.noProducts,"products-cell"),cell(r.kcal+" "+x.calories),cell(money(r.cents)),cell(r.stars+" ★"),cell(r.days+" "+x.days));body.appendChild(row);
}
function createLevelMenu(entry){
 const x=t(),details=document.createElement("details");details.className="level-menu";
 const summary=document.createElement("summary");summary.textContent=x.levels[entry.level][0];
 const content=document.createElement("div");content.className="level-menu-content";
 const table=document.createElement("table");table.className="data-table";const head=document.createElement("thead");head.appendChild(headers());table.appendChild(head);
 const body=document.createElement("tbody"),solution=bestFor(entry.level);if(solution)appendResultRow(body,x.solution,solution.ids);appendResultRow(body,x.you,entry.result.ids);table.appendChild(body);
 const title=document.createElement("p");title.textContent=entry.level===0?x.allPlayers:x.top;
 const topTable=document.createElement("table");topTable.className="data-table";const topHead=document.createElement("thead");topHead.appendChild(headers());topTable.appendChild(topHead);
 const topBody=document.createElement("tbody");topBody.id="top-"+entry.level;topTable.appendChild(topBody);
 const wrap=document.createElement("div");wrap.className="table-wrap";wrap.appendChild(table);
 const topWrap=document.createElement("div");topWrap.className="table-wrap";topWrap.appendChild(topTable);
 content.append(wrap,title,topWrap);details.append(summary,content);return details;
}
function renderOwnSummary(){
 const x=t(),head=$("summaryHead");head.replaceChildren();[x.levelCol,x.productCol,x.calorieCol,x.priceCol,x.starsCol,x.shelfCol].forEach(v=>{const th=document.createElement("th");th.textContent=v;head.appendChild(th)});
 const body=$("summaryBody");body.replaceChildren();
 completed.forEach(entry=>{const r=entry.result,row=document.createElement("tr");row.append(cell(x.levels[entry.level][0]),cell(r.ids.map(i=>x.products[i]).join(", ")||x.noProducts,"products-cell"),cell(r.kcal+" "+x.calories),cell(money(r.cents)),cell(r.stars+" ★"),cell(r.days+" "+x.days));body.appendChild(row)});
}
function renderFinalMenus(){const box=$("levelResults");box.replaceChildren();completed.forEach(e=>box.appendChild(createLevelMenu(e)))}
async function loadLeaderboard(){
 try{
  const response=await fetch(SUPABASE_URL+"/rest/v1/leaderboard?select=player,selections,created_at&order=created_at.asc&limit=10000",{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
  if(!response.ok)throw new Error();const rows=await response.json(),x=t();
  completed.forEach(entry=>{
   const body=$("top-"+entry.level);if(!body)return;body.replaceChildren();const solution=bestFor(entry.level);
   const matches=rows.map(row=>{if(!Array.isArray(row.selections))return null;const selection=row.selections.find(s=>s.level===entry.level);return selection?{row,selection}:null}).filter(Boolean);
   matches.sort((a,b)=>{const d=similarity(b.selection.ids,solution)-similarity(a.selection.ids,solution);return Math.abs(d)>1e-9?d:new Date(a.row.created_at)-new Date(b.row.created_at)});
   const shown=entry.level===0?matches:matches.slice(0,5);
   if(!shown.length){const tr=document.createElement("tr"),td=cell(x.empty);td.colSpan=6;tr.appendChild(td);body.appendChild(tr);return}
   shown.forEach(({row,selection},i)=>appendResultRow(body,entry.level===0?(row.player||x.allPlayers):"#"+(i+1),selection.ids,entry.level===0?"":(row.player||"")));
  });
 }catch(e){$("scoreStatus").textContent=t().loadError}
}
function renderFinal(){$("finalScreen").hidden=false;renderOwnSummary();renderFinalMenus();loadLeaderboard()}
async function submitResults(){
 const name=$("playerName").value.trim();if(!name){$("scoreStatus").textContent=t().enterName;$("playerName").focus();return}if(submitted)return;
 const button=$("submitScore");button.disabled=true;$("scoreStatus").textContent=t().saving;
 const selections=completed.map(e=>({level:e.level,ids:e.result.ids,durationMs:e.durationMs}));
 try{
  const response=await fetch(SUPABASE_URL+"/rest/v1/leaderboard",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({player:name.slice(0,24),selections})});
  if(!response.ok)throw new Error();submitted=true;$("nameGate").hidden=true;renderFinal();
 }catch(e){button.disabled=false;$("scoreStatus").textContent=t().saveError}
}
function finishLevel(){
 const result=total([...selected]);if(result.kcal<MIN||result.kcal>MAX)return;
 completed.push({level,result,durationMs:Math.max(0,Math.round(performance.now()-levelStartedAt))});
 if(level===4){$("game").hidden=true;$("actionBar").hidden=true;$("hintFloat").hidden=true;$("hintPopup").hidden=true;$("startScreen").hidden=true;$("nameGate").hidden=false;$("playerName").focus();return}
 level++;selected=new Set();renderStart();
}

document.querySelectorAll(".language-buttons button").forEach(button=>{
 button.addEventListener("click",()=>{currentLanguage=button.dataset.language;applyLanguage()});
});
$("startButton").addEventListener("click",()=>{levelStartedAt=performance.now();$("startScreen").hidden=true;$("game").hidden=false;$("actionBar").hidden=false;renderGame()});
$("hintFloat").addEventListener("click",()=>{
 const popup=$("hintPopup");if(!popup.hidden){popup.hidden=true;$("hintFloat").setAttribute("aria-expanded","false");return}
 popup.textContent=t().tip+t().levels[level][2]+".";popup.hidden=false;$("hintFloat").setAttribute("aria-expanded","true");
});
$("clearButton").addEventListener("click",()=>{selected.clear();renderProducts();renderSummary()});
$("nextButton").addEventListener("click",finishLevel);
$("submitScore").addEventListener("click",submitResults);
$("playerName").addEventListener("keydown",event=>{if(event.key==="Enter")submitResults()});
applyLanguage();renderStart();
</script>
</body>
</html>
