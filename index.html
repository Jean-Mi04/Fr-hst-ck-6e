<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frühstücksbox – Levels</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px 16px 82px;background:#f3f6fb;color:#203349;font-family:system-ui,sans-serif}
main{max-width:960px;margin:auto}
h1{font-size:1.5rem;margin:0 0 8px}
h2{font-size:1.1rem}
h3{font-size:1rem;margin:8px 0}
p{line-height:1.5}
.panel{background:#fff;border:1px solid #dce4ed;border-radius:15px;padding:16px;margin:13px 0}
.language-box{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0}
button{font:inherit;cursor:pointer;border:1px solid #aebfd0;background:#fff;color:#203349;border-radius:10px;padding:9px 13px}
button:hover{background:#edf5ff}
button:focus-visible,input:focus-visible{outline:3px solid #2266cc;outline-offset:3px}
button:disabled{opacity:.6;cursor:wait}
.language-button{border-radius:999px}
.language-button.active,.primary{background:#2469b2;color:#fff;border-color:#2469b2}
.progress{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.progress span{border:1px solid #d5e0ea;border-radius:999px;padding:5px 10px;font-size:.83rem}
.progress .current{background:#e9f2ff;border-color:#266ac0;font-weight:700}
.progress .done{background:#e6f5ec;border-color:#9bc9aa;color:#176747}
.task{padding:15px;background:#ffe4e4;border:2px solid #c83232;border-radius:12px;color:#781c1c;font-weight:700;font-size:1.08rem;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}
.product{display:flex;gap:9px;align-items:flex-start;border:1px solid #d7e1eb;border-radius:12px;padding:11px;cursor:pointer}
.product:has(input:checked){background:#edf6ff;border-color:#4f8bc6}
.product:has(input:disabled){opacity:.55;cursor:not-allowed}
.product input{margin-top:5px;width:19px;height:19px;accent-color:#2266bb;flex-shrink:0}
.product-info{min-width:0}
.product-name{font-size:.85rem;line-height:1.35;margin:2px 0 5px}
.product-name span{display:block}
.primary-name{font-weight:700}
.german-name{font-size:.78rem;color:#5a6d80}
.details{font-size:.82rem;color:#52677c;line-height:1.5}
.stars{display:block;color:#895400;font-size:.8rem;margin-top:4px}
.emoji{font-size:1.25rem;margin-inline-end:4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:#f2f6fa;border-radius:9px;padding:8px 10px;min-width:0}
.stat>span{display:block;font-size:.76rem;color:#55697d}
.stat strong{display:block;margin-top:3px}
.calorie-meter{position:relative;overflow:hidden;min-height:32px;margin-top:5px;border-radius:8px;background:#dfe6ed}
.calorie-fill{position:absolute;inset:0 auto 0 0;width:0%;border-radius:inherit;transition:width 350ms ease}
.calorie-meter strong{position:relative;z-index:1;display:block;padding:6px 8px}
.goal{background:#fff2c9;border-radius:9px;padding:8px 11px;margin:9px 0;font-size:.87rem;font-weight:700}
.goal.reached{background:#e6f5ec;color:#176747}
.tip{margin-top:10px;padding:12px;border:1px solid #cbdced;border-radius:10px;background:#f7fbff}
.leaderboard-panel{margin-top:18px}
.leaderboard-form{display:flex;gap:8px;margin-top:6px}
.leaderboard-form input{font:inherit;min-width:0;flex:1;border:1px solid #aebfd0;border-radius:10px;padding:9px 10px}
.level-result{border-top:1px solid #dce4ed;padding:16px 0}
.level-task-title{margin:3px 0 11px;color:#415a72;font-weight:700}
.table-wrap{overflow-x:auto;border-radius:10px}
.level-table{width:100%;min-width:590px;border-collapse:collapse;font-size:.88rem;background:#fff}
.level-table th,.level-table td{padding:9px 10px;border:1px solid #dce4ed;text-align:left;vertical-align:top}
.level-table thead th{background:#edf3f8;font-weight:700;white-space:nowrap}
.level-table tbody tr:nth-child(even){background:#f8fafc}
.level-table .name-cell{min-width:180px}
.row-label{display:block;font-weight:700}
.row-products{display:block;margin-top:3px;color:#52677c;font-size:.76rem;line-height:1.4;overflow-wrap:anywhere}
.group-row td{background:#e9f2ff!important;color:#284b6b;font-weight:700}
.empty-row{color:#64778a;font-style:italic}
#actionBar{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fffffffa;border-top:1px solid #d5e0ea;padding:9px 14px}
.action-inner{max-width:960px;margin:auto;display:flex;justify-content:flex-end;gap:9px}
[hidden]{display:none!important}
body[dir="rtl"]{text-align:right}
body[dir="rtl"] .level-table th,body[dir="rtl"] .level-table td{text-align:right}
@media(max-width:550px){
 body{padding:10px 10px 88px}
 .panel{padding:13px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .action-inner{display:grid;grid-template-columns:1fr 1.5fr}
 .action-inner button{padding:8px 6px;font-size:.85rem}
 .leaderboard-form{flex-direction:column}
 .level-table{font-size:.8rem}
 .level-table th,.level-table td{padding:7px 6px}
}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>

  <nav class="language-box" aria-label="Sprachauswahl">
    <strong id="languageLabel"></strong>
    <button class="language-button" data-lang="de" type="button">Deutsch</button>
    <button class="language-button" data-lang="ru" type="button">Русский</button>
    <button class="language-button" data-lang="ar" type="button">العربية</button>
    <button class="language-button" data-lang="en" type="button">English</button>
  </nav>

  <section class="panel" id="startScreen">
    <div class="progress" id="startProgress"></div>
    <h2 id="levelTitle"></h2>
    <p class="task" id="task"></p>
    <button class="primary" id="startButton" type="button"></button>
  </section>

  <div id="game" hidden>
    <section class="panel">
      <div class="progress" id="progress"></div>
      <h2 id="gameHeading"></h2>
      <div class="goal" id="goal"></div>
      <div class="stats">
        <div class="stat">
          <span id="calorieLabel"></span>
          <div class="calorie-meter" id="calorieMeter" role="progressbar" aria-valuemin="0" aria-valuemax="650" aria-valuenow="0">
            <div class="calorie-fill" id="calorieFill"></div>
            <strong id="calories">0 kcal</strong>
          </div>
        </div>
        <div class="stat"><span id="priceLabel"></span><strong id="price"></strong></div>
        <div class="stat"><span id="starsLabel"></span><strong id="stars"></strong></div>
        <div class="stat"><span id="countLabel"></span><strong id="count"></strong></div>
      </div>
    </section>

    <section class="panel">
      <h2 id="productsHeading"></h2>
      <div class="grid" id="products"></div>
    </section>

    <section class="panel">
      <h2 id="tipsHeading"></h2>
      <button id="tipButton" type="button"></button>
      <div class="tip" id="tip" hidden></div>
    </section>
  </div>

  <section class="panel" id="finalScreen" hidden>
    <h2 id="finalHeading"></h2>
    <p id="finalIntro"></p>

    <section class="panel leaderboard-panel">
      <h3 id="leaderboardTitle"></h3>
      <p id="scoreHint"></p>
      <label for="playerName" id="nameLabel"></label>
      <div class="leaderboard-form">
        <input id="playerName" type="text" maxlength="24" autocomplete="nickname">
        <button class="primary" id="submitScore" type="button"></button>
      </div>
      <p id="scoreStatus" role="status" aria-live="polite"></p>
    </section>

    <div id="levelResults"></div>
    <button class="primary" id="restartButton" type="button"></button>
  </section>
</main>

<div id="actionBar" hidden>
  <div class="action-inner">
    <button id="clearButton" type="button"></button>
    <button class="primary" id="nextButton" type="button"></button>
  </div>
</div>

function productName(product){

}

function total(ids){
 const result={kcal:0,cents:0,stars:0,days:Infinity,count:ids.length,ids:[...ids]};
 ids.forEach(id=>{
  const product=products[id];
  if(!product)return;
  result.kcal+=product.kcal;
  result.cents+=product.cents;
  result.stars+=product.stars;
  result.days=Math.min(result.days,product.days);
 });
 if(!Number.isFinite(result.days))result.days=0;
 return result;
}

function progress(id){
 const box=$(id);
 box.replaceChildren();
 t().levels.forEach((_,i)=>{
  const item=document.createElement("span");
  item.textContent=i===4?"Bonus":"Level "+(i+1);
  if(i<level)item.className="done";
  if(i===level)item.className="current";
  box.appendChild(item);
 });
}

 products.forEach((product,index)=>{
  const label=document.createElement("label");
  label.className="product";

  const input=document.createElement("input");
  input.type="checkbox";
  input.checked=selected.has(index);
  input.disabled=!input.checked&&sum.kcal+product.kcal>MAX;
  input.addEventListener("change",()=>{
   if(input.checked)selected.add(index);
   else selected.delete(index);
   renderProducts();
   renderSummary();
  });

  const info=document.createElement("span");
  info.className="product-info";

  const icon=document.createElement("span");
  icon.className="emoji";
  icon.textContent=product.icon;

  const name=document.createElement("span");
  name.className="product-name";
  const primary=document.createElement("span");
  primary.className="primary-name";
  primary.textContent=lang==="de"?product.de:product[lang];
  name.appendChild(primary);

  if(lang!=="de"){
   const german=document.createElement("span");
   german.className="german-name";
   german.textContent=product.de;
   name.appendChild(german);
  }

  const details=document.createElement("span");
  details.className="details";
  details.textContent=product.kcal+" kcal · "+money(product.cents)+" · "+
   t().shelf+": "+product.days+" "+t().days;

  const stars=document.createElement("span");
  stars.className="stars";
  stars.textContent=t().stars+": "+"★".repeat(product.stars)+"☆".repeat(5-product.stars);

  info.append(icon,name,details,stars);
  label.append(input,info);
  box.appendChild(label);
 });
}

function renderSummary(){
 const result=total([...selected]);
 $("calories").textContent=result.kcal+" kcal";
 $("calorieFill").style.width=Math.min(100,result.kcal/MAX*100)+"%";
 $("calorieFill").style.backgroundColor=result.kcal>=MIN?"#79bd83":"#f2bd57";
 $("calorieMeter").setAttribute("aria-valuenow",result.kcal);
 $("price").textContent=money(result.cents);
 $("stars").textContent=result.stars+" ★";
 $("count").textContent=result.count;

 const goal=$("goal");
 if(result.kcal>=MIN&&result.kcal<=MAX){
  goal.textContent=t().goalOk;
  goal.classList.add("reached");
 }else if(result.kcal<MIN){
  goal.textContent=t().goalLow.replace("{n}",MIN-result.kcal);
  goal.classList.remove("reached");
 }else{
  goal.textContent=t().goalHigh;
  goal.classList.remove("reached");
 }
}

function renderGame(){
 $("gameHeading").textContent=t().levels[level].title;
 $("productsHeading").textContent=t().products;
 $("tipsHeading").textContent=t().tips;
 $("calorieLabel").textContent=t().calories;
 $("calorieMeter").setAttribute("aria-label",t().calories);
 $("priceLabel").textContent=t().price;
 $("starsLabel").textContent=t().stars;
 $("countLabel").textContent=t().count;
 $("tip").hidden=true;
 $("tipButton").textContent=t().showTip;
 $("nextButton").textContent=level===4?t().finish:t().next;
 progress("progress");
 renderProducts();
 renderSummary();
}

function bestFor(levelIndex){
 if(Object.prototype.hasOwnProperty.call(solutionCache,levelIndex))return solutionCache[levelIndex];

 const valid=[];
 for(let mask=1;mask<(1<<products.length);mask++){
  const ids=[];
  for(let i=0;i<products.length;i++)if(mask&(1<<i))ids.push(i);
  if(levelIndex===4&&ids.includes(2))continue;
  const result=total(ids);
  if(result.kcal>=MIN&&result.kcal<=MAX)valid.push(result);
 }
 if(!valid.length)return solutionCache[levelIndex]=null;

 if(levelIndex===0||levelIndex===2){
  const near550=valid.filter(result=>result.kcal>=525&&result.kcal<=575);
  const candidates=near550.length?near550:valid;
  return solutionCache[levelIndex]=candidates.reduce((best,result)=>{
   const score=result.stars*1000-Math.abs(result.kcal-550);
   const bestScore=best.stars*1000-Math.abs(best.kcal-550);
   return score>bestScore?result:best;
  });
 }

 const score=result=>{
  if(levelIndex===1)return -result.cents;
  if(levelIndex===3)return result.days;
  return (result.stars/result.count/5+Math.min(result.days,30)/30+(1-result.cents/500))/3;
 };
 return solutionCache[levelIndex]=valid.reduce((best,result)=>score(result)>score(best)?result:best);
}

function similarity(selectionIds,solution){
 if(!solution)return 0;
 const chosen=new Set(Array.isArray(selectionIds)?selectionIds:[]);
 const target=new Set(solution.ids);
 const union=new Set([...chosen,...target]);
 let intersection=0;
 chosen.forEach(id=>{if(target.has(id))intersection++;});
 return union.size?intersection/union.size:1;
}

function timeFor(row,entry){
 if(Number.isFinite(entry.durationMs))return entry.durationMs;
 const submittedAt=new Date(row.created_at).getTime();
 return Number.isFinite(submittedAt)?submittedAt:Infinity;
}

function appendTableRow(tbody,label,ids,playerName=""){
 const validIds=Array.isArray(ids)?ids.filter(id=>Number.isInteger(id)&&products[id]):[];
 const summary=total(validIds);
 const row=document.createElement("tr");

 const nameCell=document.createElement("td");
 nameCell.className="name-cell";
 const name=document.createElement("span");
 name.className="row-label";
 name.textContent=playerName?label+" — "+playerName:label;

 const productList=document.createElement("span");
 productList.className="row-products";
 productList.textContent=validIds.length
  ?validIds.map(id=>productName(products[id])).join(", ")
  :t().noProducts;
 nameCell.append(name,productList);

 const calories=document.createElement("td");
 calories.textContent=summary.kcal+" kcal";
 const price=document.createElement("td");
 price.textContent=money(summary.cents);
 const stars=document.createElement("td");
 stars.textContent=summary.stars+" ★";
 const shelf=document.createElement("td");
 shelf.textContent=summary.days+" "+t().days;

 row.append(nameCell,calories,price,stars,shelf);
 tbody.appendChild(row);
}

function appendGroupRow(tbody,label){
 const row=document.createElement("tr");
 row.className="group-row";
 const cell=document.createElement("td");
 cell.colSpan=5;
 cell.textContent=label;
 row.appendChild(cell);
 tbody.appendChild(row);
}

function appendEmptyRow(tbody,message){
 const row=document.createElement("tr");
 row.className="empty-row";
 const cell=document.createElement("td");
 cell.colSpan=5;
 cell.textContent=message;
 row.appendChild(cell);
 tbody.appendChild(row);
}

function createLevelTable(entry){
 const labels=t();
 const section=document.createElement("section");
 section.className="level-result";

 const heading=document.createElement("h3");
 heading.textContent=entry.title;

 const task=document.createElement("p");
 task.className="level-task-title";
 task.textContent=labels.task+": "+entry.task;

 const wrap=document.createElement("div");
 wrap.className="table-wrap";

 const table=document.createElement("table");
 table.className="level-table";

 const thead=document.createElement("thead");
 const header=document.createElement("tr");
 [labels.tableName,labels.tableCalories,labels.tablePrice,labels.tableStars,labels.tableShelf].forEach(text=>{
  const th=document.createElement("th");
  th.textContent=text;
  header.appendChild(th);
 });
 thead.appendChild(header);

 const tbody=document.createElement("tbody");
 tbody.id="rows-"+entry.level;

 const solution=bestFor(entry.level);
 appendGroupRow(tbody,labels.solution);
 if(solution)appendTableRow(tbody,labels.solution,solution.ids);
 else appendEmptyRow(tbody,labels.empty);

 appendGroupRow(tbody,labels.your);
 appendTableRow(tbody,labels.your,entry.result.ids,$("playerName").value.trim());

 appendGroupRow(tbody,labels.top);
 const topBody=document.createElement("tbody");
 topBody.id="top-"+entry.level;

 table.append(thead,tbody,topBody);
 wrap.appendChild(table);
 section.append(heading,task,wrap);
 return section;
}

async function loadLeaderboard(){
 const status=$("scoreStatus");
 try{
  const url=SUPABASE_URL+
   "/rest/v1/leaderboard?select=player,selections,created_at&order=created_at.asc&limit=1000";
  const response=await fetch(url,{
   headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}
  });
  if(!response.ok)throw new Error("Could not load leaderboard");
  const rows=await response.json();

  completed.forEach(currentEntry=>{
   const tbody=$("top-"+currentEntry.level);
   if(!tbody)return;
   tbody.replaceChildren();

   const solution=bestFor(currentEntry.level);
   const matching=rows.map(row=>{
    if(!Array.isArray(row.selections))return null;
    const selection=row.selections.find(item=>item.level===currentEntry.level);
    return selection?{row,selection}:null;
   }).filter(Boolean);

   matching.sort((a,b)=>{
    const difference=similarity(b.selection.ids,solution)-similarity(a.selection.ids,solution);
    if(Math.abs(difference)>1e-9)return difference;
    return timeFor(a.row,a.selection)-timeFor(b.row,b.selection);
   });

   const topFive=matching.slice(0,5);
   if(!topFive.length){
    appendEmptyRow(tbody,t().empty);
    return;
   }

   topFive.forEach(({row,selection},index)=>{
    appendTableRow(tbody,"#"+(index+1),selection.ids,row.player||"");
   });
  });

  if(!submittedOnce)status.textContent="";
 }catch(error){
  status.textContent=t().boardError;
 }
}

function renderFinal(){
 $("finalHeading").textContent=t().final;
 $("finalIntro").textContent=t().finalIntro;
 $("leaderboardTitle").textContent=t().boardTitle;
 $("scoreHint").textContent=t().scoreHint;
 $("nameLabel").textContent=t().nameLabel;
 $("playerName").placeholder=t().namePlaceholder;
 $("submitScore").textContent=t().submit;
 $("submitScore").hidden=submittedOnce;
 $("submitScore").disabled=false;
 $("restartButton").textContent=t().restart;

 const box=$("levelResults");
 box.replaceChildren();
 completed.forEach(entry=>box.appendChild(createLevelTable({
  ...entry,
  title:t().levels[entry.level].title,
  task:t().levels[entry.level].task
 })));
 loadLeaderboard();
}

async function submitResults(){
 const name=$("playerName").value.trim();
 const status=$("scoreStatus");
 const button=$("submitScore");

 if(submittedOnce)return;
 if(!name){
  status.textContent=t().needName;
  $("playerName").focus();
  return;
 }
 if(completed.length!==5){
  status.textContent=t().boardError;
  return;
 }

 button.disabled=true;
 status.textContent=t().saving;

 const selections=completed.map(entry=>({
  level:entry.level,
  ids:entry.result.ids,
  durationMs:entry.durationMs
 }));

 try{
  const response=await fetch(SUPABASE_URL+"/rest/v1/leaderboard",{
   method:"POST",
   headers:{
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json",
    "Prefer":"return=minimal"
   },
   body:JSON.stringify({player:name.slice(0,24),selections})
  });
  if(!response.ok)throw new Error("Could not save results");

  submittedOnce=true;
  button.hidden=true;
  await loadLeaderboard();
  status.textContent=t().saved;
 }catch(error){
  button.disabled=false;
  status.textContent=t().boardError;
 }
}

function finishLevel(){
 const result=total([...selected]);
 if(result.kcal<MIN||result.kcal>MAX)return;

 completed.push({
  level,
  result,
  durationMs:Math.max(0,Math.round(performance.now()-levelStartedAt))
 });

 if(level===4){
  $("game").hidden=true;
  $("actionBar").hidden=true;
  $("finalScreen").hidden=false;
  renderFinal();
  return;
 }

 level++;
 selected=new Set();
 renderStart();
}

function renderAll(){
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.body.dir=lang==="ar"?"rtl":"ltr";
 $("title").textContent=t().title;
 $("languageLabel").textContent=t().language;
 $("startButton").textContent=t().start;
 $("clearButton").textContent=t().clear;
 $("restartButton").textContent=t().restart;

 document.querySelectorAll(".language-button").forEach(button=>{
  button.classList.toggle("active",button.dataset.lang===lang);
 });

 if(!$("startScreen").hidden)renderStart();
 if(!$("game").hidden)renderGame();
 if(!$("finalScreen").hidden)renderFinal();
}

document.querySelectorAll(".language-button").forEach(button=>{
 button.addEventListener("click",()=>{
  lang=button.dataset.lang;
  renderAll();
 });
});

$("startButton").addEventListener("click",()=>{
 levelStartedAt=performance.now();
 $("startScreen").hidden=true;
 $("game").hidden=false;
 $("actionBar").hidden=false;
 renderGame();
});

$("tipButton").addEventListener("click",()=>{
 const tip=$("tip");
 if(!tip.hidden){
  tip.hidden=true;
  $("tipButton").textContent=t().showTip;
  return;
 }
 tip.textContent=t().factor+" "+t().levels[level].factor+".";
 tip.hidden=false;
 $("tipButton").textContent=t().hideTip;
});

$("clearButton").addEventListener("click",()=>{
 selected.clear();
 renderProducts();
 renderSummary();
});

$("nextButton").addEventListener("click",finishLevel);
$("submitScore").addEventListener("click",submitResults);
$("playerName").addEventListener("keydown",event=>{
 if(event.key==="Enter")submitResults();
});

$("restartButton").addEventListener("click",()=>{
 level=0;
 selected=new Set();
 completed=[];
 submittedOnce=false;
 $("playerName").value="";
 $("scoreStatus").textContent="";
 $("submitScore").hidden=false;
 renderStart();
});

renderAll();
</script>
</body>
</html>
