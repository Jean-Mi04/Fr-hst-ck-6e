<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frühstücksbox – Levels</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px 16px 88px;background:#f3f6fb;color:#203349;font-family:system-ui,sans-serif}
main{max-width:1000px;margin:auto}
h1{font-size:1.6rem;margin:0 0 8px}
h2{font-size:1.15rem;margin-top:0}
p{line-height:1.5}
.panel,.comparison{background:#fff;border:1px solid #dce4ed;border-radius:16px;padding:16px;margin:14px 0}
.language-box{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0}
button{font:inherit;cursor:pointer;border:1px solid #aebfd0;background:#fff;color:#203349;border-radius:10px;padding:9px 13px}
button:hover{background:#edf5ff}
button:focus-visible,input:focus-visible{outline:3px solid #2266cc;outline-offset:3px}
.language-button{border-radius:999px}
.language-button.active,.primary{background:#2469b2;color:#fff;border-color:#2469b2}
.primary{font-weight:700}
.muted{color:#5a6d80;font-size:.9rem}
.progress{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.progress span{border:1px solid #d5e0ea;border-radius:999px;padding:5px 10px;font-size:.85rem;color:#54697d}
.progress .current{background:#e9f2ff;border-color:#266ac0;color:#17324d;font-weight:700}
.progress .done{background:#e6f5ec;border-color:#9bc9aa;color:#176747}
.intro-screen{min-height:48vh;display:flex;align-items:center;justify-content:center}
.intro-card{width:min(100%,700px);text-align:center;padding:clamp(18px,5vw,42px)}
.task{font-size:1.08rem;line-height:1.6;margin:18px auto;max-width:580px;padding:14px;background:#eef5ff;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}
.product{display:flex;gap:9px;align-items:flex-start;border:1px solid #d7e1eb;border-radius:12px;padding:11px;cursor:pointer}
.product:has(input:checked){background:#edf6ff;border-color:#4f8bc6}
.product:has(input:disabled){opacity:.55;cursor:not-allowed}
.product input{margin-top:6px;width:19px;height:19px;accent-color:#2266bb;flex-shrink:0}
.product-info{min-width:0}
.product-name{font-size:.82rem;line-height:1.3;margin:2px 0 5px}
.product-name .primary-name{display:block;font-weight:700}
.product-name .german-name{display:block;font-size:.76rem;color:#5a6d80}
.emoji{font-size:1.3rem;margin-inline-end:4px}
.details{display:block;font-size:.82rem;color:#52677c;line-height:1.5}
.stars{display:block;color:#895400;font-size:.8rem;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:#f2f6fa;border-radius:9px;padding:8px 10px}
.stat span{display:block;font-size:.76rem;color:#55697d}
.stat strong{display:block;margin-top:3px}
.calorie-row{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:#52677c;margin:8px 0 5px}
.calorie-track{height:10px;background:#e5ebf1;border-radius:99px;overflow:hidden}
.calorie-fill{height:100%;width:0;background:#e6a529;border-radius:99px}
.calorie-fill.reached{background:#39a56a}
.goal-status{background:#fff2c9;border-radius:9px;padding:8px 11px;margin:9px 0;font-size:.87rem;font-weight:700}
.goal-status.reached{background:#e6f5ec;color:#176747}
.expiry{font-size:.8rem;color:#52677c;margin:8px 0 0}
.tip{margin-top:12px;padding:12px;border:1px solid #cbdced;border-radius:10px;line-height:1.5}
#summaryPanel{position:sticky;top:6px;z-index:10;padding:12px;margin:10px 0;box-shadow:0 5px 14px #20334920}
#summaryHeading{font-size:.96rem;line-height:1.35;margin:0}
#actionBar{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fffffffa;border-top:1px solid #d5e0ea;padding:9px 14px;box-shadow:0 -5px 16px #20334920}
.action-inner{max-width:1000px;margin:auto;display:flex;justify-content:flex-end;gap:9px}
[hidden]{display:none!important}
.comparison{padding:13px}
.comparison h3{margin:0 0 10px;font-size:1rem}
.comparison-columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:11px}
.comparison-column>strong{display:block;margin-bottom:7px}
.result-card{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f7f9fc;border:1px solid #dce4ed;border-radius:12px;padding:10px}
.result-info{min-width:0}
.result-info h4{font-size:.9rem;margin:0 0 5px}
.result-info p{font-size:.76rem;margin:4px 0;line-height:1.4}
.lunchbox{flex:0 0 78px;min-height:64px;padding:5px;background:#fff3d7;border:2px solid #c88c44;border-radius:7px 7px 12px 12px;display:grid;grid-template-columns:repeat(3,1fr);align-content:center;justify-items:center;gap:1px;direction:ltr}
.lunchbox span{font-size:1rem;line-height:1.2}
.lunchbox .more{font-size:.68rem;font-weight:700;color:#6b4a24}
.comparison-note{background:#eef5ff;border-radius:9px;padding:9px 11px;margin:9px 0 0;line-height:1.5}
@media(max-width:550px){
 body{padding:10px 10px 90px}
 .panel{padding:13px}
 h1{font-size:1.4rem}
 #summaryPanel .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
 #actionBar{padding:8px}
 .action-inner{display:grid;grid-template-columns:1fr 1.5fr;gap:7px}
 .action-inner button{padding:8px 6px;font-size:.85rem}
 .result-card{padding:7px}
}
body[dir="rtl"]{text-align:right}
body[dir="rtl"] .action-inner{justify-content:flex-start}
</style>
</head>
<body>
<main>
  <h1 id="appTitle"></h1>
  <p id="appIntro"></p>

  <nav class="language-box" aria-label="Sprachauswahl">
    <strong id="languageLabel"></strong>
    <button class="language-button" type="button" data-lang="de">Deutsch</button>
    <button class="language-button" type="button" data-lang="ru">Русский</button>
    <button class="language-button" type="button" data-lang="ar">العربية</button>
    <button class="language-button" type="button" data-lang="en">English</button>
  </nav>

  <section class="panel intro-screen" id="introScreen">
    <div class="intro-card">
      <div class="progress" id="introProgress"></div>
      <h2 id="introHeading"></h2>
      <p class="task" id="introTask"></p>
      <p class="muted" id="introNote"></p>
      <button type="button" class="primary" id="startButton"></button>
    </div>
  </section>

  <div id="game" hidden>
    <section class="panel"><div class="progress" id="progress"></div></section>
    <section class="panel" id="summaryPanel" aria-live="polite">
      <h2 id="summaryHeading"></h2>
      <div class="calorie-row"><span id="calorieProgressLabel"></span><strong id="calorieLabel"></strong></div>
      <div class="calorie-track" role="progressbar" id="calorieBar" aria-valuemin="0" aria-valuemax="650" aria-valuenow="0"><div class="calorie-fill" id="calorieFill"></div></div>
      <div class="goal-status" id="goalStatus"></div>
      <div class="stats">
        <div class="stat"><span id="kcalLabel"></span><strong id="kcal"></strong></div>
        <div class="stat"><span id="priceLabel"></span><strong id="price"></strong></div>
        <div class="stat"><span id="starsLabel"></span><strong id="stars"></strong></div>
        <div class="stat"><span id="countLabel"></span><strong id="count"></strong></div>
      </div>
      <p class="expiry" id="expiry"></p>
    </section>
    <section class="panel">
      <h2 id="productsHeading"></h2>
      <div class="grid" id="products"></div>
      <p class="muted" id="dateNote"></p>
    </section>
    <section class="panel">
      <h2 id="tipsHeading"></h2>
      <button type="button" id="tipButton"></button>
      <div class="tip" id="tip" hidden></div>
    </section>
  </div>

  <section class="panel" id="finalScreen" hidden>
    <h2 id="finalHeading"></h2>
    <p id="finalIntro"></p>
    <div id="allResults"></div>
    <button type="button" class="primary" id="restartButton"></button>
  </section>
</main>

<div id="actionBar" hidden>
  <div class="action-inner">
    <button type="button" id="clearButton"></button>
    <button type="button" class="primary" id="nextButton"></button>
  </div>
</div>

 {icon:"🥪",de:"Weißbrot mit Salami",en:"White bread with salami",ru:"Белый хлеб с салями",ar:"خبز أبيض مع السلامي",kcal:300,cents:70,stars:2,days:1},
 {icon:"🧀",de:"Käsesticks",en:"Cheese strings",ru:"Сырные палочки",ar:"أصابع الجبن",kcal:60,cents:30,stars:2,days:28},
 {icon:"🥣",de:"Joghurt",en:"Yogurt",ru:"Йогурт",ar:"زبادي",kcal:90,cents:35,stars:3,days:14},
 {icon:"🍌",de:"Banane",en:"Banana",ru:"Банан",ar:"موز",kcal:100,cents:40,stars:3,days:5},
 {icon:"🍞",de:"Vollkornbrot mit Käse",en:"Whole-grain bread with cheese",ru:"Цельнозерновой хлеб с сыром",ar:"خبز حبوب كاملة مع الجبن",kcal:250,cents:60,stars:3,days:4},
 {icon:"🍎",de:"Apfel",en:"Apple",ru:"Яблоко",ar:"تفاحة",kcal:80,cents:40,stars:4,days:14},
 {icon:"🥕",de:"Gemüse-Sticks",en:"Vegetable sticks",ru:"Овощные палочки",ar:"أصابع الخضار",kcal:40,cents:60,stars:5,days:3},
 {icon:"🍓",de:"Erdbeeren",en:"Strawberries",ru:"Клубника",ar:"فراولة",kcal:32,cents:70,stars:4,days:2},
 {icon:"🥪",de:"Vollkornsandwich mit Hähnchen",en:"Whole-grain chicken sandwich",ru:"Цельнозерновой сэндвич с курицей",ar:"شطيرة خبز الحبوب الكاملة بالدجاج",kcal:320,cents:160,stars:5,days:1}
];

const $=id=>document.getElementById(id);
const MIN_KCAL=500,MAX_KCAL=650;
let lang="de",currentLevel=0,selected=new Set(),completedResults=[];
const t=()=>translations[lang];
const locale=()=>({de:"de-DE",ru:"ru-RU",ar:"ar-SY",en:"en-GB"}[lang]);
const money=cents=>(cents/100).toLocaleString(locale(),{style:"currency",currency:"EUR"});
function tr(key,vars={}){
 let text=t()[key];
 for(const [name,value] of Object.entries(vars))text=text.replaceAll("{"+name+"}",String(value));
 return text;
}
function productName(p){return lang==="de"?p.de:p[lang]+" / "+p.de}
function dayUnit(n){return n===1?t().day:t().days}
function summarize(ids){
 const r={ids:[...ids],kcal:0,cents:0,stars:0,count:0,firstDays:Infinity};
 ids.forEach(i=>{const p=rawProducts[i];r.kcal+=p.kcal;r.cents+=p.cents;r.stars+=p.stars;r.count++;r.firstDays=Math.min(r.firstDays,p.days)});
 r.averageStars=r.count?r.stars/r.count:0;
 return r;
}
function renderProgress(id){
 const box=$(id);box.replaceChildren();
 t().levels.forEach((_,i)=>{
  const s=document.createElement("span");
  s.textContent=i===5?(lang==="de"?"Bonus":"Bonus"):(lang==="de"?"Level ":"")+(i+1);
  if(i<currentLevel)s.className="done";
  if(i===currentLevel)s.className="current";
  box.appendChild(s);
 });
}
function renderIntro(){
 $("introHeading").textContent=t().levels[currentLevel][0];
 $("introTask").textContent=t().levels[currentLevel][1];
 renderProgress("introProgress");
 $("introScreen").hidden=false;$("game").hidden=true;$("actionBar").hidden=true;$("finalScreen").hidden=true;
}
function renderProducts(){
 const box=$("products"),kcal=summarize(selected).kcal;box.replaceChildren();
 rawProducts.forEach((p,i)=>{
  const label=document.createElement("label");label.className="product";
  const input=document.createElement("input");input.type="checkbox";input.checked=selected.has(i);
  input.disabled=!selected.has(i)&&kcal+p.kcal>MAX_KCAL;
  input.addEventListener("change",()=>{if(input.checked)selected.add(i);else selected.delete(i);renderProducts();renderSummary()});
  const info=document.createElement("span");info.className="product-info";
  const icon=document.createElement("span");icon.className="emoji";icon.textContent=p.icon;icon.setAttribute("aria-hidden","true");
  const name=document.createElement("span");name.className="product-name";
  const primary=document.createElement("span");primary.className="primary-name";primary.textContent=lang==="de"?p.de:p[lang];
  name.appendChild(primary);
  if(lang!=="de"){const german=document.createElement("span");german.className="german-name";german.textContent=p.de;name.appendChild(german)}
  const details=document.createElement("span");details.className="details";
  details.textContent=p.kcal+" kcal · "+money(p.cents)+" · "+t().shelf+": "+p.days+" "+dayUnit(p.days);
  const stars=document.createElement("span");stars.className="stars";stars.textContent=t().stars+": "+"★".repeat(p.stars)+"☆".repeat(5-p.stars);
  info.append(icon,name,details,stars);label.append(input,info);box.appendChild(label);
 });
}
function renderSummary(){
 const r=summarize(selected);
 $("kcal").textContent=r.kcal+" kcal";$("price").textContent=money(r.cents);
 $("stars").textContent=r.stars+" ★";$("count").textContent=r.count;
 $("calorieFill").style.width=Math.min(r.kcal/MAX_KCAL*100,100)+"%";
 $("calorieFill").classList.toggle("reached",r.kcal>=MIN_KCAL);
 $("calorieLabel").textContent=r.kcal+" / "+MAX_KCAL+" kcal";
 $("calorieBar").setAttribute("aria-valuenow",Math.min(r.kcal,MAX_KCAL));
 const goal=$("goalStatus");
 if(r.kcal>=MIN_KCAL&&r.kcal<=MAX_KCAL){goal.textContent=tr("goalDone");goal.classList.add("reached")}
 else if(r.kcal<MIN_KCAL){goal.textContent=tr("goalLow",{n:MIN_KCAL-r.kcal});goal.classList.remove("reached")}
 else{goal.textContent=tr("goalHigh");goal.classList.remove("reached")}
 $("expiry").textContent=r.count?tr("expiry",{days:r.firstDays,unit:dayUnit(r.firstDays)}):"";
}
function renderStatic(){
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.body.dir=lang==="ar"?"rtl":"ltr";
 $("appTitle").textContent=t().title;$("appIntro").textContent=t().intro;
 $("languageLabel").textContent=t().lang;$("introNote").textContent=t().note;
 $("startButton").textContent=t().start;$("productsHeading").textContent=t().choose;
 $("tipsHeading").textContent=t().tips;$("tipButton").textContent=$("tip").hidden?t().tipShow:t().tipHide;
 $("clearButton").textContent=t().clear;$("finalHeading").textContent=t().final;
 $("finalIntro").textContent=t().finalIntro;$("restartButton").textContent=t().restart;
 $("calorieProgressLabel").textContent=t().progress;$("kcalLabel").textContent=t().kcal;
 $("priceLabel").textContent=t().price;$("starsLabel").textContent=t().stars;
 $("countLabel").textContent=t().count;$("dateNote").textContent=t().dateNote;
 document.querySelectorAll(".language-button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
 if(!$("introScreen").hidden)renderIntro();
 if(!$("game").hidden){
  $("summaryHeading").textContent=t().levels[currentLevel][0]+" — "+t().levels[currentLevel][1];
  $("nextButton").textContent=currentLevel===5?t().finish:t().next;
  renderProgress("progress");renderProducts();renderSummary();
 }
 if(!$("finalScreen").hidden)renderFinalResults();
}
function startLevel(){
 $("introScreen").hidden=true;$("game").hidden=false;$("actionBar").hidden=false;$("finalScreen").hidden=true;
 $("summaryHeading").textContent=t().levels[currentLevel][0]+" — "+t().levels[currentLevel][1];
 $("tip").hidden=true;$("tipButton").textContent=t().tipShow;
 $("nextButton").textContent=currentLevel===5?t().finish:t().next;
 renderProgress("progress");renderProducts();renderSummary();window.scrollTo({top:0,behavior:"smooth"});
}
function findBest(level){
 const list=[];
 for(let mask=1;mask<(1<<rawProducts.length);mask++){
  const ids=[];for(let i=0;i<rawProducts.length;i++)if(mask&(1<<i))ids.push(i);
  const r=summarize(ids);if(r.kcal>=MIN_KCAL&&r.kcal<=MAX_KCAL)list.push(r);
 }
 if(!list.length)return null;
 if(level===0)return list.reduce((a,b)=>b.cents<a.cents?b:a);
 if(level===5){
  const min=Math.min(...list.map(r=>r.cents)),max=Math.max(...list.map(r=>r.cents));
  list.forEach(r=>{
   const health=r.averageStars/5,shelf=Math.min(r.firstDays,30)/30;
   const price=max===min?1:(max-r.cents)/(max-min);
   r.score=(health+shelf+price)/3;
  });
  return list.reduce((a,b)=>b.score>a.score?b:a);
 }
 const score=r=>level===1?-r.count:level===2?-r.cents:level===3?r.stars:r.firstDays;
 return list.reduce((a,b)=>{
  if(score(a)!==score(b))return score(b)>score(a)?b:a;
  return b.cents<a.cents?b:a;
 });
}
function productList(ids){return ids.map(i=>productName(rawProducts[i])).join("; ")}
function showTip(){
 $("tip").hidden=false;
 if(currentLevel===0){$("tip").textContent=t().tipFirst;$("tipButton").textContent=t().tipHide;return}
 const r=findBest(currentLevel);
 if(!r){$("tip").textContent=t().noTip;$("tipButton").textContent=t().tipHide;return}
 const items=productList(r.ids);
 if(currentLevel===5){
  $("tip").textContent=tr("bonusTip",{items,kcal:r.kcal,price:money(r.cents),stars:r.averageStars.toFixed(1),days:r.firstDays});
 }else{
  const detail=currentLevel===1?tr("few",{n:r.count}):currentLevel===2?tr("cheap",{price:money(r.cents)}):currentLevel===3?tr("manyStars",{n:r.stars}):tr("long",{n:r.firstDays});
  $("tip").textContent=tr("tipLead")+" "+items+" ("+r.kcal+" kcal; "+detail+").";
 }
 $("tipButton").textContent=t().tipHide;
}
function resultCard(entry){
 const r=entry.result,card=document.createElement("article");card.className="result-card";
 const info=document.createElement("div");info.className="result-info";
 const heading=document.createElement("h4");heading.textContent=t().levels[entry.level][0];
 const foods=document.createElement("p");foods.textContent=t().products+": "+productList(r.ids);
 const stats=document.createElement("p");stats.textContent=r.kcal+" kcal · "+money(r.cents)+" · "+r.stars+" ★";
 const expiry=document.createElement("p");expiry.textContent=tr("resultExpiry",{days:r.firstDays,unit:dayUnit(r.firstDays)});
 info.append(heading,foods,stats,expiry);
 const box=document.createElement("div");box.className="lunchbox";box.setAttribute("role","img");box.setAttribute("aria-label",productList(r.ids));
 r.ids.slice(0,8).forEach(i=>{const s=document.createElement("span");s.textContent=rawProducts[i].icon;box.appendChild(s)});
 if(r.ids.length>8){const more=document.createElement("span");more.className="more";more.textContent="+"+(r.ids.length-8);box.appendChild(more)}
 card.append(info,box);return card;
}
function compareNote(entry,model){
 if(entry.level===0)return t().taste;
 if(entry.level===5)return t().bonusCompare;
 const mine=entry.result;
 let mineValue,modelValue;
 if(entry.level===1){mineValue=mine.count;modelValue=model.count}
 else if(entry.level===2){mineValue=mine.cents;modelValue=model.cents}
 else if(entry.level===3){mineValue=mine.stars;modelValue=model.stars}
 else{mineValue=mine.firstDays;modelValue=model.firstDays}
 if(mineValue===modelValue)return t().match;
 const better=entry.level===1||entry.level===2?mineValue<modelValue:mineValue>modelValue;
 return better?t().better:t().target;
}
function renderFinalResults(){
 const box=$("allResults");box.replaceChildren();
 completedResults.forEach(entry=>{
  const model=findBest(entry.level);if(!model)return;
  const section=document.createElement("section");section.className="comparison";
  const heading=document.createElement("h3");heading.textContent=t().levels[entry.level][0];
  const columns=document.createElement("div");columns.className="comparison-columns";
  const own=document.createElement("div");own.className="comparison-column";
  const ownLabel=document.createElement("strong");ownLabel.textContent=t().your;
  own.append(ownLabel,resultCard(entry));
  const sample=document.createElement("div");sample.className="comparison-column";
  const sampleLabel=document.createElement("strong");sampleLabel.textContent=entry.level===0?t().example:t().model;
  sample.append(sampleLabel,resultCard({level:entry.level,result:model}));
  columns.append(own,sample);
  const note=document.createElement("p");note.className="comparison-note";note.textContent=compareNote(entry,model);
  section.append(heading,columns,note);box.appendChild(section);
 });
}
function finishLevel(){
 const r=summarize(selected);
 if(r.kcal<MIN_KCAL||r.kcal>MAX_KCAL){renderSummary();return}
 completedResults.push({level:currentLevel,result:r});
 if(currentLevel===5){
  $("game").hidden=true;$("actionBar").hidden=true;$("finalScreen").hidden=false;
  renderFinalResults();window.scrollTo({top:0,behavior:"smooth"});return;
 }
 currentLevel++;selected=new Set();renderIntro();window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll(".language-button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;renderStatic()}));
$("startButton").addEventListener("click",startLevel);
$("tipButton").addEventListener("click",()=>{if(!$("tip").hidden){$("tip").hidden=true;$("tipButton").textContent=t().tipShow}else showTip()});
$("clearButton").addEventListener("click",()=>{selected.clear();renderProducts();renderSummary()});
$("nextButton").addEventListener("click",finishLevel);
$("restartButton").addEventListener("click",()=>{currentLevel=0;selected=new Set();completedResults=[];renderIntro();window.scrollTo({top:0,behavior:"smooth"})});
renderStatic();
</script>
</body>
</html>
