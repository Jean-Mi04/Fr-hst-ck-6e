<title>Frühstücksbox – Levels und Bonuslevel</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 14px 82px;background:#f3f6fb;color:#203349;font-family:system-ui,sans-serif}
main{max-width:960px;margin:auto}
.site-logo{position:sticky;top:0;z-index:30;height:66px;padding:5px 0;background:#f3f6fb;display:flex;align-items:center;gap:9px}
.site-logo svg{display:block;flex:0 0 auto;width:82px;height:50px}
.language-buttons{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.language-buttons button{min-height:29px;padding:4px 8px;border:1px solid #aebfd0;border-radius:7px;background:#fff;color:#203349;font-size:.72rem;font-weight:700}
.language-buttons button.active{background:#2469b2;border-color:#2469b2;color:#fff}
h1{font-size:1.35rem;margin:8px 0}
h2{font-size:1.1rem}
h3{font-size:1rem}
.panel{background:#fff;border:1px solid #dce4ed;border-radius:15px;padding:16px;margin:13px 0}
button,input{font:inherit}
button{cursor:pointer;border:1px solid #aebfd0;background:#fff;color:#203349;border-radius:10px;padding:9px 13px}
button:hover{background:#edf5ff}
button:focus-visible,input:focus-visible{outline:3px solid #2266cc;outline-offset:3px}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:#2469b2;color:#fff;border-color:#2469b2}
.progress{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.progress span{border:1px solid #d5e0ea;border-radius:999px;padding:5px 10px;font-size:.83rem}
.progress .current{background:#e9f2ff;border-color:#266ac0;font-weight:700}
.progress .done{background:#e6f5ec;border-color:#9bc9aa;color:#176747}
.task{padding:14px;background:#ffe4e4;border:2px solid #c83232;border-radius:12px;color:#781c1c;font-weight:700;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:9px}
.product{display:flex;gap:8px;align-items:flex-start;min-width:0;border:1px solid #d7e1eb;border-radius:12px;padding:10px;cursor:pointer}
.product:has(input:checked){background:#edf6ff;border-color:#4f8bc6}
.product:has(input:disabled){opacity:.55;cursor:not-allowed}
.product input{margin:4px 0 0;width:18px;height:18px;accent-color:#2266bb;flex-shrink:0}
.product-info{display:block;flex:1;min-width:0}
.product-name,.details{display:block;overflow-wrap:anywhere}
.product-name{font-size:.88rem;line-height:1.35;margin:2px 0 5px;font-weight:700}
.details{font-size:.82rem;color:#52677c;line-height:1.45}
.stars{display:block;color:#895400;font-size:.8rem;margin-top:4px}
.emoji{font-size:1.2rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:#f2f6fa;border-radius:8px;padding:7px 8px;min-width:0}
.stat>span{display:block;font-size:.72rem;color:#55697d}
.stat strong{display:block;margin-top:2px;font-size:.88rem;overflow-wrap:anywhere}
.calorie-meter{position:relative;overflow:hidden;min-height:27px;margin-top:4px;border-radius:7px;background:#dfe6ed}
.calorie-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;transition:width 200ms}
.calorie-meter strong{position:relative;z-index:1;display:block;padding:4px 6px}
.goal{background:#fff2c9;border-radius:9px;padding:8px 10px;margin:9px 0;font-size:.84rem;font-weight:700}
.goal.reached{background:#e6f5ec;color:#176747}
#game>.panel:first-child{position:sticky;top:66px;z-index:10;box-shadow:0 5px 14px #2033491a}
#actionBar{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fffffffa;border-top:1px solid #d5e0ea;padding:8px 14px}
.action-inner{max-width:960px;margin:auto;display:flex;justify-content:flex-end;gap:8px}
#hintFloat{position:fixed;z-index:40;left:50%;bottom:72px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:5px;min-height:40px;padding:0 12px;border:2px solid #d89d00;border-radius:999px;background:#fff3bd;box-shadow:0 3px 12px #20334945;font:inherit;font-size:.88rem;font-weight:700}
#hintFloat span:first-child{font-size:20px}
#hintFloat:hover{background:#ffe68a}
#hintPopup{position:fixed;z-index:39;left:50%;bottom:120px;transform:translateX(-50%);width:min(320px,calc(100vw - 32px));padding:12px 14px;border:1px solid #d7c47c;border-radius:12px;background:#fffdf2;box-shadow:0 5px 18px #20334935;line-height:1.5}
.table-wrap{width:100%;overflow-x:auto;border-radius:10px}
.data-table{width:100%;min-width:760px;table-layout:fixed;border-collapse:collapse;font-size:.84rem;background:#fff}
.data-table col:nth-child(1){width:25%}
.data-table col:nth-child(2){width:35%}
.data-table col:nth-child(3){width:12%}
.data-table col:nth-child(4){width:9%}
.data-table col:nth-child(5){width:8%}
.data-table col:nth-child(6){width:11%}
.data-table th,.data-table td{padding:8px;border:1px solid #dce4ed;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.data-table th{background:#edf3f8}
.data-table tbody tr:nth-child(even){background:#f8fafc}
.level-menu{margin:10px 0;border:1px solid #dce4ed;border-radius:12px;background:#fff;overflow:hidden}
.level-menu summary{cursor:pointer;padding:12px 14px;background:#edf3f8;font-weight:700}
.level-menu-content{padding:12px}
.products-cell{overflow-wrap:anywhere}
[hidden]{display:none!important}
[dir="rtl"] .progress{flex-direction:row-reverse}
@media(min-width:700px) and (max-width:1180px){
 #game>.panel:first-child{padding:7px 11px;margin:5px 0;border-radius:11px}
 #game>.panel:first-child .progress{gap:4px;margin:0 0 3px}
 #game>.panel:first-child .progress span{padding:2px 7px;font-size:.7rem}
 #gameHeading{font-size:.92rem;margin:3px 0}
 #goal{margin:4px 0;padding:4px 8px;font-size:.72rem;line-height:1.25}
 .stats{gap:4px}
 .stat{padding:3px 6px;border-radius:6px}
 .stat>span{font-size:.64rem}
 .stat strong{margin-top:0;font-size:.76rem;line-height:1.2}
 .calorie-meter{min-height:21px;margin-top:2px}
 .calorie-meter strong{padding:2px 5px}
}
@media(max-width:699px){
 body{padding-left:10px;padding-right:10px}
 .panel{padding:13px}
 .stats{gap:5px}
 .stat{padding:6px}
 .stat>span{font-size:.68rem}
 .stat strong{font-size:.8rem}
 .action-inner{display:grid;grid-template-columns:1fr 1.5fr}
 .action-inner button{padding:8px 6px;font-size:.85rem}
 #hintFloat{bottom:76px}
 #hintPopup{bottom:122px}
}
</style>

function money(c){return(c/100).toLocaleString(lang==="en"?"en-GB":lang==="ar"?"ar":"de-DE",{style:"currency",currency:"EUR"})}
function total(ids=[...selected]){let r={kcal:0,cents:0,stars:0,days:Infinity,count:ids.length,ids:[...ids]};ids.forEach(i=>{let p=foods[i];if(p){r.kcal+=p.kcal;r.cents+=p.cents;r.stars+=p.stars;r.days=Math.min(r.days,p.days)}});if(!Number.isFinite(r.days))r.days=0;return r}
function progress(id){let box=$(id);box.replaceChildren();t().levels.forEach((_,i)=>{let s=document.createElement("span");s.textContent=i===4?"Bonus":"Level "+(i+1);if(i<level)s.className="done";if(i===level)s.className="current";box.appendChild(s)})}
function applyLanguage(){
 let x=t();document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("pageTitle").textContent=x.page;$("productsHeading").textContent=x.productsTitle;
 $("calorieLabel").textContent=x.calories;$("priceLabel").textContent=x.price;$("starsLabel").textContent=x.stars;$("shelfLabel").textContent=x.shelf;
 $("startButton").textContent=x.start;$("clearButton").textContent=x.clear;$("hintLabel").textContent=x.tips;$("hintFloat").setAttribute("aria-label",x.tips);
 $("nameHeading").textContent=x.nameHeading;$("nameInstructions").textContent=x.nameInstructions;$("nameLabel").textContent=x.nameLabel;$("playerName").placeholder=x.namePlaceholder;$("submitScore").textContent=x.save;
 $("finalHeading").textContent=x.final;$("finalInstructions").textContent=x.finalInstructions;$("summaryHeading").textContent=x.summary;$("leaderboardHeading").textContent=x.leaderboard;
 document.querySelectorAll(".language-buttons button").forEach(b=>{let active=b.dataset.language===lang;b.classList.toggle("active",active);b.setAttribute("aria-pressed",String(active))});
 if(!$("startScreen").hidden)renderStart();if(!$("game").hidden)renderGame();
 if(!$("finalScreen").hidden){renderOwnSummary();renderFinalMenus();loadLeaderboard()}
}
function renderStart(){
 $("startScreen").hidden=false;$("game").hidden=true;$("actionBar").hidden=true;$("hintFloat").hidden=true;$("hintPopup").hidden=true;$("nameGate").hidden=true;$("finalScreen").hidden=true;
 $("levelTitle").textContent=t().levels[level][0];$("task").textContent="❗ "+t().levels[level][1];progress("startProgress");
}
function renderProducts(){
 let x=t(),box=$("products"),sum=total();box.replaceChildren();
 foods.forEach((p,i)=>{let label=document.createElement("label");label.className="product";
 let input=document.createElement("input");input.type="checkbox";input.checked=selected.has(i);input.disabled=!input.checked&&sum.kcal+p.kcal>MAX;
 input.addEventListener("change",()=>{input.checked?selected.add(i):selected.delete(i);renderProducts();renderSummary()});
 let icon=document.createElement("span");icon.className="emoji";icon.textContent=p.icon;
 let info=document.createElement("span");info.className="product-info";
 let name=document.createElement("span");name.className="product-name";name.textContent=x.products[i];
 let detail=document.createElement("span");detail.className="details";detail.textContent=p.kcal+" "+x.calories+" · "+money(p.cents)+" · "+x.shelf+": "+p.days+" "+x.days;
 let stars=document.createElement("span");stars.className="stars";stars.textContent=x.health+" "+"★".repeat(p.stars)+"☆".repeat(5-p.stars);
 info.append(name,detail,stars);label.append(input,icon,info);box.appendChild(label)});
}
function renderSummary(){
 let x=t(),r=total();$("calories").textContent=r.kcal+" "+x.calories;$("price").textContent=money(r.cents);$("stars").textContent=r.stars+" ★";$("shelfLife").textContent=r.days+" "+x.days;
 $("calorieFill").style.width=Math.min(100,r.kcal/MAX*100)+"%";$("calorieFill").style.backgroundColor=r.kcal>=MIN?"#79bd83":"#f2bd57";$("calorieMeter").setAttribute("aria-valuenow",r.kcal);
 let g=$("goal");if(r.kcal>=MIN&&r.kcal<=MAX){g.textContent=x.goal;g.classList.add("reached")}else if(r.kcal<MIN){g.textContent=x.short+(MIN-r.kcal)+x.until;g.classList.remove("reached")}else{g.textContent=x.tooMany;g.classList.remove("reached")}
}
function renderGame(){$("gameHeading").textContent=t().levels[level][0];$("hintPopup").hidden=true;$("hintFloat").hidden=false;$("hintFloat").setAttribute("aria-expanded","false");$("nextButton").textContent=level===4?t().bonus:t().next;progress("progress");renderProducts();renderSummary()}
function bestFor(n){
 if(n in solutionCache)return solutionCache[n];let valid=[];
 for(let mask=1;mask<(1<<foods.length);mask++){let ids=[];for(let i=0;i<foods.length;i++)if(mask&(1<<i))ids.push(i);if(n===4&&ids.includes(2))continue;let r=total(ids);if(r.kcal>=MIN&&r.kcal<=MAX)valid.push(r)}
 if(!valid.length)return solutionCache[n]=null;
 if(n===0||n===2){let close=valid.filter(x=>x.kcal>=525&&x.kcal<=575),a=(close.length?close:valid);return solutionCache[n]=a.reduce((u,v)=>v.stars*1000-Math.abs(v.kcal-550)>u.stars*1000-Math.abs(u.kcal-550)?v:u)}
 let score=x=>n===1?-x.cents:n===3?x.days:(x.stars/x.count/5+Math.min(x.days,30)/30+(1-x.cents/500))/3;
 return solutionCache[n]=valid.reduce((u,v)=>score(v)>score(u)?v:u)
}
function makeHeaders(){let x=t(),trEl=document.createElement("tr");[x.levelCol,x.productCol,x.calorieCol,x.priceCol,x.starsCol,x.shelfCol].forEach(v=>{let th=document.createElement("th");th.textContent=v;trEl.appendChild(th)});return trEl}
function addResultRow(body,label,ids,name=""){
 let x=t(),valid=Array.isArray(ids)?ids.filter(i=>Number.isInteger(i)&&foods[i]):[],r=total(valid),row=document.createElement("tr");
 [label+(name?" — "+name:""),valid.map(i=>x.products[i]).join(", ")||x.noProducts,r.kcal+" "+x.calories,money(r.cents),r.stars+" ★",r.days+" "+x.days].forEach((v,i)=>{let td=document.createElement("td");td.textContent=v;if(i===1)td.className="products-cell";row.appendChild(td)});body.appendChild(row)
}
function table(){
 let tbl=document.createElement("table");tbl.className="data-table";
 let cg=document.createElement("colgroup");for(let i=0;i<6;i++)cg.appendChild(document.createElement("col"));
 let head=document.createElement("thead");head.appendChild(makeHeaders());tbl.append(cg,head);return tbl
}
function createMenu(entry){
 let x=t(),details=document.createElement("details");details.className="level-menu";
 let summary=document.createElement("summary");summary.textContent=x.levels[entry.level][0];
 let content=document.createElement("div");content.className="level-menu-content";
 let ownTable=table(),ownBody=document.createElement("tbody"),solution=bestFor(entry.level);
 if(solution)addResultRow(ownBody,x.solution,solution.ids);addResultRow(ownBody,x.you,entry.result.ids);ownTable.appendChild(ownBody);
 let wrap=document.createElement("div");wrap.className="table-wrap";wrap.appendChild(ownTable);
 let title=document.createElement("h3");title.textContent=entry.level===0?x.allPlayers:x.top;
 let topTable=table(),topBody=document.createElement("tbody");topBody.id="top-"+entry.level;topTable.appendChild(topBody);
 let topWrap=document.createElement("div");topWrap.className="table-wrap";topWrap.appendChild(topTable);
 content.append(wrap,title,topWrap);details.append(summary,content);return details
}
function renderOwnSummary(){
 let h=$("summaryHead");h.replaceChildren();let headers=makeHeaders();while(headers.firstChild)h.appendChild(headers.firstChild);
 let body=$("summaryBody");body.replaceChildren();
 completed.forEach(e=>{let r=e.result,row=document.createElement("tr");[t().levels[e.level][0],r.ids.map(i=>t().products[i]).join(", ")||t().noProducts,r.kcal+" "+t().calories,money(r.cents),r.stars+" ★",r.days+" "+t().days].forEach((v,i)=>{let td=document.createElement("td");td.textContent=v;if(i===1)td.className="products-cell";row.appendChild(td)});body.appendChild(row)})
}
function renderFinalMenus(){let box=$("levelResults");box.replaceChildren();completed.forEach(e=>box.appendChild(createMenu(e)))}
function similarity(ids,solution){if(!solution)return 0;let a=new Set(Array.isArray(ids)?ids:[]),b=new Set(solution.ids),u=new Set([...a,...b]),n=0;a.forEach(i=>{if(b.has(i))n++});return u.size?n/u.size:1}
async function loadLeaderboard(){
 try{
  let res=await fetch(SUPABASE_URL+"/rest/v1/leaderboard?select=player,selections,created_at&order=created_at.asc&limit=10000",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
  if(!res.ok)throw Error("load");let rows=await res.json(),x=t();
  completed.forEach(e=>{let body=$("top-"+e.level);if(!body)return;body.replaceChildren();let sol=bestFor(e.level);
   let matches=rows.map(row=>({row,selection:Array.isArray(row.selections)?row.selections.find(s=>s.level===e.level):null})).filter(v=>v.selection);
   matches.sort((a,b)=>{let d=similarity(b.selection.ids,sol)-similarity(a.selection.ids,sol);return Math.abs(d)>1e-9?d:new Date(a.row.created_at)-new Date(b.row.created_at)});
   let shown=e.level===0?matches:matches.slice(0,5);
   if(!shown.length){let row=document.createElement("tr"),td=document.createElement("td");td.colSpan=6;td.textContent=x.empty;row.appendChild(td);body.appendChild(row);return}
   shown.forEach((v,i)=>addResultRow(body,e.level===0?(v.row.player||x.allPlayers):"#"+(i+1),v.selection.ids,e.level===0?"":(v.row.player||"")))
  })
 }catch(e){$("scoreStatus").textContent=t().loadError}
}
function renderFinal(){$("finalScreen").hidden=false;renderOwnSummary();renderFinalMenus();loadLeaderboard()}
async function submitResults(){
 let name=$("playerName").value.trim();if(!name){$("scoreStatus").textContent=t().enterName;$("playerName").focus();return}if(submitted)return;
 let button=$("submitScore");button.disabled=true;$("scoreStatus").textContent=t().saving;
 try{
  let res=await fetch(SUPABASE_URL+"/rest/v1/leaderboard",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({player:name.slice(0,24),selections:completed.map(e=>({level:e.level,ids:e.result.ids}))})});
  if(!res.ok)throw Error("save");submitted=true;$("nameGate").hidden=true;renderFinal()
 }catch(e){button.disabled=false;$("scoreStatus").textContent=t().saveError}
}
function finishLevel(){
 let result=total();if(result.kcal<MIN||result.kcal>MAX)return;completed.push({level,result});
 if(level===4){$("game").hidden=true;$("actionBar").hidden=true;$("hintFloat").hidden=true;$("hintPopup").hidden=true;$("startScreen").hidden=true;$("nameGate").hidden=false;$("playerName").focus();return}
 level++;selected.clear();renderStart()
}
document.querySelectorAll(".language-buttons button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.language;applyLanguage()}));
$("startButton").addEventListener("click",()=>{$("startScreen").hidden=true;$("game").hidden=false;$("actionBar").hidden=false;renderGame()});
$("hintFloat").addEventListener("click",()=>{let p=$("hintPopup");if(!p.hidden){p.hidden=true;$("hintFloat").setAttribute("aria-expanded","false");return}p.textContent=t().tip+t().levels[level][2]+".";p.hidden=false;$("hintFloat").setAttribute("aria-expanded","true")});
$("clearButton").addEventListener("click",()=>{selected.clear();renderProducts();renderSummary()});
$("nextButton").addEventListener("click",finishLevel);
$("submitScore").addEventListener("click",submitResults);
$("playerName").addEventListener("keydown",e=>{if(e.key==="Enter")submitResults()});
applyLanguage();renderStart();
</script>
</body>
</html>
