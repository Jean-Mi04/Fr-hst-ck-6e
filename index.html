<html lang="de">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frühstücksbox – Levels und Bonuslevel</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 14px 82px;background:#f3f6fb;color:#203349;font-family:system-ui,sans-serif}
main{max-width:960px;margin:auto}
.site-logo{position:sticky;top:0;z-index:30;height:66px;padding:5px 0;background:#f3f6fb;display:flex;align-items:center;gap:9px}
.site-logo svg{display:block;flex:0 0 auto;width:82px;height:50px}
.language-buttons{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.language-buttons button{min-height:29px;padding:4px 8px;border:1px solid #aebfd0;border-radius:7px;background:#fff;color:#203349;font-size:.72rem;font-weight:700}
.language-buttons button.active{background:#2469b2;border-color:#2469b2;color:#fff}
h1{font-size:1.35rem;margin:8px 0}
h2{font-size:1.1rem}
h3{font-size:1rem}
.panel{background:#fff;border:1px solid #dce4ed;border-radius:15px;padding:16px;margin:13px 0}
button,input{font:inherit}
button{cursor:pointer;border:1px solid #aebfd0;background:#fff;color:#203349;border-radius:10px;padding:9px 13px}
button:hover{background:#edf5ff}
button:focus-visible,input:focus-visible{outline:3px solid #2266cc;outline-offset:3px}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:#2469b2;color:#fff;border-color:#2469b2}
.progress{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.progress span{border:1px solid #d5e0ea;border-radius:999px;padding:5px 10px;font-size:.83rem}
.progress .current{background:#e9f2ff;border-color:#266ac0;font-weight:700}
.progress .done{background:#e6f5ec;border-color:#9bc9aa;color:#176747}
.task{padding:14px;background:#ffe4e4;border:2px solid #c83232;border-radius:12px;color:#781c1c;font-weight:700;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:9px}
.product{display:flex;gap:8px;align-items:flex-start;min-width:0;border:1px solid #d7e1eb;border-radius:12px;padding:10px;cursor:pointer}
.product:has(input:checked){background:#edf6ff;border-color:#4f8bc6}
.product:has(input:disabled){opacity:.55;cursor:not-allowed}
.product input{margin:4px 0 0;width:18px;height:18px;accent-color:#2266bb;flex-shrink:0}
.product-info{display:block;flex:1;min-width:0}
.product-name,.details{display:block;overflow-wrap:anywhere}
.product-name{font-size:.88rem;line-height:1.35;margin:2px 0 5px;font-weight:700}
.details{font-size:.82rem;color:#52677c;line-height:1.45}
.stars{display:block;color:#895400;font-size:.8rem;margin-top:4px}
.emoji{font-size:1.2rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:#f2f6fa;border-radius:8px;padding:7px 8px;min-width:0}
.stat>span{display:block;font-size:.72rem;color:#55697d}
.stat strong{display:block;margin-top:2px;font-size:.88rem;overflow-wrap:anywhere}
.calorie-meter{position:relative;overflow:hidden;min-height:27px;margin-top:4px;border-radius:7px;background:#dfe6ed}
.calorie-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;transition:width 200ms}
.calorie-meter strong{position:relative;z-index:1;display:block;padding:4px 6px}
.goal{background:#fff2c9;border-radius:9px;padding:8px 10px;margin:9px 0;font-size:.84rem;font-weight:700}
.goal.reached{background:#e6f5ec;color:#176747}
#game>.panel:first-child{position:sticky;top:66px;z-index:10;box-shadow:0 5px 14px #2033491a}
#actionBar{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fffffffa;border-top:1px solid #d5e0ea;padding:8px 14px}
.action-inner{max-width:960px;margin:auto;display:flex;justify-content:flex-end;gap:8px}
#hintFloat{position:fixed;z-index:40;left:50%;bottom:72px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:5px;min-height:40px;padding:0 12px;border:2px solid #d89d00;border-radius:999px;background:#fff3bd;box-shadow:0 3px 12px #20334945;font:inherit;font-size:.88rem;font-weight:700}
#hintFloat span:first-child{font-size:20px}
#hintFloat:hover{background:#ffe68a}
#hintPopup{position:fixed;z-index:39;left:50%;bottom:120px;transform:translateX(-50%);width:min(320px,calc(100vw - 32px));padding:12px 14px;border:1px solid #d7c47c;border-radius:12px;background:#fffdf2;box-shadow:0 5px 18px #20334935;line-height:1.5}
.table-wrap{width:100%;overflow-x:auto;border-radius:10px}
.data-table{width:100%;min-width:760px;table-layout:fixed;border-collapse:collapse;font-size:.84rem;background:#fff}
.data-table col:nth-child(1){width:25%}
.data-table col:nth-child(2){width:35%}
.data-table col:nth-child(3){width:12%}
.data-table col:nth-child(4){width:9%}
.data-table col:nth-child(5){width:8%}
.data-table col:nth-child(6){width:11%}
.data-table th,.data-table td{padding:8px;border:1px solid #dce4ed;text-align:start;vertical-align:top;overflow-wrap:anywhere}
.data-table th{background:#edf3f8}
.data-table tbody tr:nth-child(even){background:#f8fafc}
.level-menu{margin:10px 0;border:1px solid #dce4ed;border-radius:12px;background:#fff;overflow:hidden}
.level-menu summary{cursor:pointer;padding:12px 14px;background:#edf3f8;font-weight:700}
.level-menu-content{padding:12px}
.products-cell{overflow-wrap:anywhere}
.final-instruction{
 display:flex;
 align-items:center;
 gap:24px;
 margin:14px 0 22px;
 padding:16px;
 border:1px solid #d6e3d1;
 border-radius:12px;
 background:#f5faf1
}
.final-instruction-text{flex:1;min-width:0}
.final-instruction-text p{margin:0;font-size:1.05rem;line-height:1.65;font-weight:600}
.worksheet-preview{
 display:block;
 flex:0 0 280px;
 width:280px;
 max-width:100%;
 height:auto;
 background:#fff;
 border:1px solid #c9d1c4;
 border-radius:5px;
 box-shadow:0 3px 10px #20334915
}
#leaderboardStatus{font-size:.9rem;color:#9b2525}
[hidden]{display:none!important}
[dir="rtl"] .progress{flex-direction:row-reverse}
@media(min-width:700px) and (max-width:1180px){
 #game>.panel:first-child{padding:7px 11px;margin:5px 0;border-radius:11px}
 #game>.panel:first-child .progress{gap:4px;margin:0 0 3px}
 #game>.panel:first-child .progress span{padding:2px 7px;font-size:.7rem}
 #gameHeading{font-size:.92rem;margin:3px 0}
 #goal{margin:4px 0;padding:4px 8px;font-size:.72rem;line-height:1.25}
 .stats{gap:4px}
 .stat{padding:3px 6px;border-radius:6px}
 .stat>span{font-size:.64rem}
 .stat strong{margin-top:0;font-size:.76rem;line-height:1.2}
 .calorie-meter{min-height:21px;margin-top:2px}
 .calorie-meter strong{padding:2px 5px}
}
@media(max-width:699px){
 body{padding-left:10px;padding-right:10px}
 .panel{padding:13px}
 .stats{gap:5px}
 .stat{padding:6px}
 .stat>span{font-size:.68rem}
 .stat strong{font-size:.8rem}
 .action-inner{display:grid;grid-template-columns:1fr 1.5fr}
 .action-inner button{padding:8px 6px;font-size:.85rem}
 #hintFloat{bottom:76px}
 #hintPopup{bottom:122px}
 .final-instruction{flex-direction:column;align-items:stretch;gap:14px;padding:13px}
 .worksheet-preview{flex:none;width:min(100%,340px);align-self:center}
}
</style>

 {icon:"🍫",kcal:110,cents:40,stars:1,days:180},
 {icon:"🍞",kcal:270,cents:45,stars:2,days:2},
 {icon:"🥐",kcal:290,cents:70,stars:2,days:21},
 {icon:"🥪",kcal:300,cents:70,stars:2,days:1},
 {icon:"🧀",kcal:60,cents:30,stars:2,days:28},
 {icon:"🥣",kcal:90,cents:35,stars:3,days:14},
 {icon:"🍌",kcal:100,cents:40,stars:3,days:5},
 {icon:"🍞",kcal:250,cents:60,stars:3,days:4},
 {icon:"🍎",kcal:80,cents:40,stars:4,days:14},
 {icon:"🥕",kcal:40,cents:60,stars:5,days:3},

const t=()=>translations[lang];

function money(c){
 return(c/100).toLocaleString(lang==="en"?"en-GB":lang==="ar"?"ar":"de-DE",{style:"currency",currency:"EUR"});
}
function total(ids=[...selected]){
 const r={kcal:0,cents:0,stars:0,days:Infinity,count:ids.length,ids:[...ids]};
 ids.forEach(i=>{
  const p=products[i];
  if(p){r.kcal+=p.kcal;r.cents+=p.cents;r.stars+=p.stars;r.days=Math.min(r.days,p.days)}
 });
 if(!Number.isFinite(r.days))r.days=0;
 return r;
}
function progress(id){
 const box=$(id);box.replaceChildren();
 t().levels.forEach((_,i)=>{
  const s=document.createElement("span");
  s.textContent=i===4?"Bonus":"Level "+(i+1);
  if(i<level)s.className="done";
  if(i===level)s.className="current";
  box.appendChild(s);
 });
}
function applyLanguage(){
 const x=t();
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 const labels={
  pageTitle:x.page,productsHeading:x.productsTitle,calorieLabel:x.calories,
  priceLabel:x.price,starsLabel:x.stars,shelfLabel:x.shelf,startButton:x.start,
  clearButton:x.clear,hintLabel:x.tips,nameHeading:x.nameHeading,
  nameInstructions:x.nameInstructions,nameLabel:x.nameLabel,submitScore:x.save,
  finalHeading:x.final,finalInstructions:x.finalInstructions,
  summaryHeading:x.summary,leaderboardHeading:x.leaderboard
 };
 Object.entries(labels).forEach(([id,text])=>$(id).textContent=text);
 $("playerName").placeholder=x.namePlaceholder;
 $("hintFloat").setAttribute("aria-label",x.tips);
 document.querySelectorAll(".language-buttons button").forEach(b=>{
  const active=b.dataset.language===lang;
  b.classList.toggle("active",active);
  b.setAttribute("aria-pressed",String(active));
 });
 if(!$("startScreen").hidden)renderStart();
 if(!$("game").hidden)renderGame();
 if(!$("finalScreen").hidden){renderOwnSummary();renderFinalMenus();loadLeaderboard()}
}
function renderStart(){
 $("startScreen").hidden=false;
 ["game","actionBar","hintFloat","hintPopup","nameGate","finalScreen"].forEach(id=>$(id).hidden=true);
 $("levelTitle").textContent=t().levels[level][0];
 $("task").textContent="❗ "+t().levels[level][1];
 progress("startProgress");
}
function renderProducts(){
 const x=t(),box=$("products"),sum=total();
 box.replaceChildren();
 products.forEach((p,i)=>{
  const label=document.createElement("label");label.className="product";
  const input=document.createElement("input");
  input.type="checkbox";input.checked=selected.has(i);
  input.disabled=!input.checked&&sum.kcal+p.kcal>MAX;
  input.addEventListener("change",()=>{
   if(input.checked)selected.add(i);else selected.delete(i);
   renderProducts();renderSummary();
  });
  const icon=document.createElement("span");icon.className="emoji";icon.textContent=p.icon;
  const info=document.createElement("span");info.className="product-info";
  const name=document.createElement("span");name.className="product-name";name.textContent=x.products[i];
  const detail=document.createElement("span");detail.className="details";
  detail.textContent=p.kcal+" "+x.calories+" · "+money(p.cents)+" · "+x.shelf+": "+p.days+" "+x.days;
  const stars=document.createElement("span");stars.className="stars";
  stars.textContent=x.health+" "+"★".repeat(p.stars)+"☆".repeat(5-p.stars);
  info.append(name,detail,stars);label.append(input,icon,info);box.appendChild(label);
 });
}
function renderSummary(){
 const x=t(),r=total();
 $("calories").textContent=r.kcal+" "+x.calories;
 $("price").textContent=money(r.cents);
 $("stars").textContent=r.stars+" ★";
 $("shelfLife").textContent=r.days+" "+x.days;
 $("calorieFill").style.width=Math.min(100,r.kcal/MAX*100)+"%";
 $("calorieFill").style.backgroundColor=r.kcal>=MIN?"#79bd83":"#f2bd57";
 $("calorieMeter").setAttribute("aria-valuenow",r.kcal);
 const goal=$("goal");
 if(r.kcal>=MIN&&r.kcal<=MAX){
  goal.textContent=x.goal;goal.classList.add("reached");
 }else if(r.kcal<MIN){
  goal.textContent=x.short+(MIN-r.kcal)+x.until;goal.classList.remove("reached");
 }else{
  goal.textContent=x.tooMany;goal.classList.remove("reached");
 }
}
function renderGame(){
 $("gameHeading").textContent=t().levels[level][0];
 $("hintPopup").hidden=true;$("hintFloat").hidden=false;
 $("hintFloat").setAttribute("aria-expanded","false");
 $("nextButton").textContent=level===4?t().bonus:t().next;
 progress("progress");renderProducts();renderSummary();
}
function bestFor(n){
 if(Object.prototype.hasOwnProperty.call(solutionCache,n))return solutionCache[n];
 const valid=[];
 for(let mask=1;mask<(1<<products.length);mask++){
  const ids=[];
  for(let i=0;i<products.length;i++)if(mask&(1<<i))ids.push(i);
  if(n===4&&ids.includes(2))continue;
  const r=total(ids);
  if(r.kcal>=MIN&&r.kcal<=MAX)valid.push(r);
 }
 if(!valid.length)return solutionCache[n]=null;
 if(n===0||n===2){
  const close=valid.filter(x=>x.kcal>=525&&x.kcal<=575);
  const choices=close.length?close:valid;
  return solutionCache[n]=choices.reduce((a,b)=>
   b.stars*1000-Math.abs(b.kcal-550)>a.stars*1000-Math.abs(a.kcal-550)?b:a);
 }
 const score=x=>n===1?-x.cents:n===3?x.days:
  (x.stars/x.count/5+Math.min(x.days,30)/30+(1-x.cents/500))/3;
 return solutionCache[n]=valid.reduce((a,b)=>score(b)>score(a)?b:a);
}
function similarity(ids,solution){
 if(!solution)return 0;
 const chosen=new Set(Array.isArray(ids)?ids:[]),target=new Set(solution.ids);
 const union=new Set([...chosen,...target]);
 let common=0;chosen.forEach(id=>{if(target.has(id))common++});
 return union.size?common/union.size:1;
}
function makeHeaders(){
 const x=t(),row=document.createElement("tr");
 [x.levelCol,x.productCol,x.calorieCol,x.priceCol,x.starsCol,x.shelfCol].forEach(text=>{
  const th=document.createElement("th");th.scope="col";th.textContent=text;row.appendChild(th);
 });
 return row;
}
function appendResultRow(body,label,ids,name=""){
 const x=t();
 const valid=Array.isArray(ids)?ids.filter(i=>Number.isInteger(i)&&products[i]):[];
 const r=total(valid),row=document.createElement("tr");
 const values=[
  label+(name?" — "+name:""),
  valid.map(i=>x.products[i]).join(", ")||x.noProducts,
  r.kcal+" "+x.calories,money(r.cents),r.stars+" ★",r.days+" "+x.days
 ];
 values.forEach((text,i)=>{
  const td=document.createElement("td");td.textContent=text;
  if(i===1)td.className="products-cell";
  row.appendChild(td);
 });
 body.appendChild(row);
}
function createTable(){
 const table=document.createElement("table");table.className="data-table";
 const cols=document.createElement("colgroup");
 for(let i=0;i<6;i++)cols.appendChild(document.createElement("col"));
 const head=document.createElement("thead");head.appendChild(makeHeaders());
 table.append(cols,head);return table;
}
function createLevelMenu(entry){
 const x=t(),details=document.createElement("details");details.className="level-menu";
 const summary=document.createElement("summary");summary.textContent=x.levels[entry.level][0];
 const content=document.createElement("div");content.className="level-menu-content";
 const ownTable=createTable(),body=document.createElement("tbody"),solution=bestFor(entry.level);
 if(solution)appendResultRow(body,x.solution,solution.ids);
 appendResultRow(body,x.you,entry.result.ids);ownTable.appendChild(body);
 const wrap=document.createElement("div");wrap.className="table-wrap";wrap.appendChild(ownTable);
 const title=document.createElement("h3");title.textContent=entry.level===0?x.allPlayers:x.top;
 const topTable=createTable(),topBody=document.createElement("tbody");
 topBody.id="top-"+entry.level;topTable.appendChild(topBody);
 const topWrap=document.createElement("div");topWrap.className="table-wrap";topWrap.appendChild(topTable);
 content.append(wrap,title,topWrap);details.append(summary,content);return details;
}
function renderOwnSummary(){
 const head=$("summaryHead"),headers=makeHeaders();
 head.replaceChildren();
 while(headers.firstChild)head.appendChild(headers.firstChild);
 const body=$("summaryBody");body.replaceChildren();
 completed.forEach(entry=>appendResultRow(body,t().levels[entry.level][0],entry.result.ids));
}
function renderFinalMenus(){
 const box=$("levelResults");box.replaceChildren();
 completed.forEach(entry=>box.appendChild(createLevelMenu(entry)));
}
async function loadLeaderboard(){
 const status=$("leaderboardStatus");
 status.hidden=true;status.textContent="";
 try{
  const response=await fetch(
   SUPABASE_URL+"/rest/v1/leaderboard?select=player,selections,created_at&order=created_at.asc&limit=10000",
   {headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}}
  );
  if(!response.ok)throw new Error("load");
  const rows=await response.json(),x=t();
  completed.forEach(entry=>{
   const body=$("top-"+entry.level);if(!body)return;
   body.replaceChildren();
   const solution=bestFor(entry.level);
   const matches=rows.map(row=>{
    if(!Array.isArray(row.selections))return null;
    const selection=row.selections.find(s=>s.level===entry.level);
    return selection?{row,selection}:null;
   }).filter(Boolean);
   matches.sort((a,b)=>{
    const diff=similarity(b.selection.ids,solution)-similarity(a.selection.ids,solution);
    return Math.abs(diff)>1e-9?diff:new Date(a.row.created_at)-new Date(b.row.created_at);
   });
   const shown=entry.level===0?matches:matches.slice(0,5);
   if(!shown.length){
    const row=document.createElement("tr"),td=document.createElement("td");
    td.colSpan=6;td.textContent=x.empty;row.appendChild(td);body.appendChild(row);return;
   }
   shown.forEach(({row,selection},i)=>appendResultRow(
    body,entry.level===0?(row.player||x.allPlayers):"#"+(i+1),
    selection.ids,entry.level===0?"":(row.player||"")
   ));
  });
 }catch(error){
  status.textContent=t().loadError;status.hidden=false;
 }
}
function renderFinal(){
 $("finalScreen").hidden=false;
 renderOwnSummary();renderFinalMenus();loadLeaderboard();
}
async function submitResults(){
 const name=$("playerName").value.trim();
 if(!name){$("scoreStatus").textContent=t().enterName;$("playerName").focus();return}
 if(submitted)return;
 const button=$("submitScore");button.disabled=true;$("scoreStatus").textContent=t().saving;
 try{
  const response=await fetch(SUPABASE_URL+"/rest/v1/leaderboard",{
   method:"POST",
   headers:{
    apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json",Prefer:"return=minimal"
   },
   body:JSON.stringify({
    player:name.slice(0,24),
    selections:completed.map(entry=>({level:entry.level,ids:entry.result.ids}))
   })
  });
  if(!response.ok)throw new Error("save");
  submitted=true;$("nameGate").hidden=true;renderFinal();
 }catch(error){
  button.disabled=false;$("scoreStatus").textContent=t().saveError;
 }
}
function finishLevel(){
 const result=total();
 if(result.kcal<MIN||result.kcal>MAX)return;
 completed.push({level,result});
 if(level===4){
  ["game","actionBar","hintFloat","hintPopup","startScreen"].forEach(id=>$(id).hidden=true);
  $("nameGate").hidden=false;$("playerName").focus();return;
 }
 level++;selected.clear();renderStart();
}
document.querySelectorAll(".language-buttons button").forEach(button=>
 button.addEventListener("click",()=>{lang=button.dataset.language;applyLanguage()})
);
$("startButton").addEventListener("click",()=>{
 $("startScreen").hidden=true;$("game").hidden=false;$("actionBar").hidden=false;renderGame();
});
$("hintFloat").addEventListener("click",()=>{
 const popup=$("hintPopup");
 if(!popup.hidden){popup.hidden=true;$("hintFloat").setAttribute("aria-expanded","false");return}
 popup.textContent=t().tip+t().levels[level][2]+".";
 popup.hidden=false;$("hintFloat").setAttribute("aria-expanded","true");
});
$("clearButton").addEventListener("click",()=>{selected.clear();renderProducts();renderSummary()});
$("nextButton").addEventListener("click",finishLevel);
$("submitScore").addEventListener("click",submitResults);
$("playerName").addEventListener("keydown",event=>{if(event.key==="Enter")submitResults()});
applyLanguage();renderStart();
