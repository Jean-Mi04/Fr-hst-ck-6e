function money(c){return(c/100).toLocaleString(lang==="en"?"en-GB":lang==="ar"?"ar":"de-DE",{style:"currency",currency:"EUR"})}
function total(ids=[...selected]){
 const r={kcal:0,cents:0,stars:0,days:Infinity,count:ids.length,ids:[...ids]};
 ids.forEach(i=>{const p=products[i];if(p){r.kcal+=p.kcal;r.cents+=p.cents;r.stars+=p.stars;r.days=Math.min(r.days,p.days)}});
 if(!Number.isFinite(r.days))r.days=0;return r;
}
function progress(id){
 const box=$(id);box.replaceChildren();
 t().levels.forEach((_,i)=>{const s=document.createElement("span");s.textContent=i===4?"Bonus":"Level "+(i+1);if(i<level)s.className="done";if(i===level)s.className="current";box.appendChild(s)});
}
function applyLanguage(){
 const x=t();document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("pageTitle").textContent=x.page;$("productsHeading").textContent=x.productsTitle;
 $("calorieLabel").textContent=x.calories;$("priceLabel").textContent=x.price;$("starsLabel").textContent=x.stars;$("shelfLabel").textContent=x.shelf;
 $("startButton").textContent=x.start;$("clearButton").textContent=x.clear;$("hintLabel").textContent=x.tips;$("hintFloat").setAttribute("aria-label",x.tips);
 $("nameHeading").textContent=x.nameHeading;$("nameInstructions").textContent=x.nameInstructions;$("nameLabel").textContent=x.nameLabel;$("playerName").placeholder=x.namePlaceholder;$("submitScore").textContent=x.save;
 $("finalHeading").textContent=x.final;$("finalInstructions").textContent=x.finalInstructions;$("summaryHeading").textContent=x.summary;$("leaderboardHeading").textContent=x.leaderboard;
 document.querySelectorAll(".language-buttons button").forEach(b=>{const active=b.dataset.language===lang;b.classList.toggle("active",active);b.setAttribute("aria-pressed",String(active))});
 if(!$("startScreen").hidden)renderStart();
 if(!$("game").hidden)renderGame();
 if(!$("finalScreen").hidden){renderOwnSummary();renderFinalMenus();loadLeaderboard()}
}
function renderStart(){
 $("startScreen").hidden=false;$("game").hidden=true;$("actionBar").hidden=true;$("hintFloat").hidden=true;$("hintPopup").hidden=true;$("nameGate").hidden=true;$("finalScreen").hidden=true;
 $("levelTitle").textContent=t().levels[level][0];$("task").textContent="❗ "+t().levels[level][1];progress("startProgress");
}
function renderProducts(){
 const x=t(),box=$("products"),sum=total();box.replaceChildren();
 products.forEach((p,i)=>{
  const label=document.createElement("label");label.className="product";
  const input=document.createElement("input");input.type="checkbox";input.checked=selected.has(i);input.disabled=!input.checked&&sum.kcal+p.kcal>MAX;
  input.addEventListener("change",()=>{if(input.checked)selected.add(i);else selected.delete(i);renderProducts();renderSummary()});
  const icon=document.createElement("span");icon.className="emoji";icon.textContent=p.icon;
  const info=document.createElement("span");info.className="product-info";
  const name=document.createElement("span");name.className="product-name";name.textContent=x.products[i];
  const detail=document.createElement("span");detail.className="details";detail.textContent=p.kcal+" "+x.calories+" · "+money(p.cents)+" · "+x.shelf+": "+p.days+" "+x.days;
  const stars=document.createElement("span");stars.className="stars";stars.textContent=x.health+" "+"★".repeat(p.stars)+"☆".repeat(5-p.stars);
  info.append(name,detail,stars);label.append(input,icon,info);box.appendChild(label);
 });
}
function renderSummary(){
 const x=t(),r=total();$("calories").textContent=r.kcal+" "+x.calories;$("price").textContent=money(r.cents);$("stars").textContent=r.stars+" ★";$("shelfLife").textContent=r.days+" "+x.days;
 $("calorieFill").style.width=Math.min(100,r.kcal/MAX*100)+"%";$("calorieFill").style.backgroundColor=r.kcal>=MIN?"#79bd83":"#f2bd57";$("calorieMeter").setAttribute("aria-valuenow",r.kcal);
 const goal=$("goal");
 if(r.kcal>=MIN&&r.kcal<=MAX){goal.textContent=x.goal;goal.classList.add("reached")}
 else if(r.kcal<MIN){goal.textContent=x.short+(MIN-r.kcal)+x.until;goal.classList.remove("reached")}
 else{goal.textContent=x.tooMany;goal.classList.remove("reached")}
}
function renderGame(){
 $("gameHeading").textContent=t().levels[level][0];$("hintPopup").hidden=true;$("hintFloat").hidden=false;$("hintFloat").setAttribute("aria-expanded","false");
 $("nextButton").textContent=level===4?t().bonus:t().next;progress("progress");renderProducts();renderSummary();
}
function bestFor(n){
 if(Object.prototype.hasOwnProperty.call(solutionCache,n))return solutionCache[n];
 const valid=[];
 for(let mask=1;mask<(1<<products.length);mask++){
  const ids=[];for(let i=0;i<products.length;i++)if(mask&(1<<i))ids.push(i);
  if(n===4&&ids.includes(2))continue;
  const r=total(ids);if(r.kcal>=MIN&&r.kcal<=MAX)valid.push(r);
 }
 if(!valid.length)return solutionCache[n]=null;
 if(n===0||n===2){
  const close=valid.filter(x=>x.kcal>=525&&x.kcal<=575),choices=close.length?close:valid;
  return solutionCache[n]=choices.reduce((a,b)=>b.stars*1000-Math.abs(b.kcal-550)>a.stars*1000-Math.abs(a.kcal-550)?b:a);
 }
 const score=x=>n===1?-x.cents:n===3?x.days:(x.stars/x.count/5+Math.min(x.days,30)/30+(1-x.cents/500))/3;
 return solutionCache[n]=valid.reduce((a,b)=>score(b)>score(a)?b:a);
}
function similarity(ids,solution){
 if(!solution)return 0;const chosen=new Set(Array.isArray(ids)?ids:[]),target=new Set(solution.ids),union=new Set([...chosen,...target]);let common=0;
 chosen.forEach(id=>{if(target.has(id))common++});return union.size?common/union.size:1;
}
function cell(text,className=""){const td=document.createElement("td");td.textContent=text;if(className)td.className=className;return td}
function makeHeaders(){
 const x=t(),tr=document.createElement("tr");
 [x.levelCol,x.productCol,x.calorieCol,x.priceCol,x.starsCol,x.shelfCol].forEach(v=>{const th=document.createElement("th");th.textContent=v;tr.appendChild(th)});return tr;
}
function appendResultRow(body,label,ids,name=""){
 const x=t(),valid=Array.isArray(ids)?ids.filter(i=>Number.isInteger(i)&&products[i]):[],r=total(valid),tr=document.createElement("tr");
 tr.append(cell(label+(name?" — "+name:""),"products-cell"),cell(valid.map(i=>x.products[i]).join(", ")||x.noProducts,"products-cell"),cell(r.kcal+" "+x.calories),cell(money(r.cents)),cell(r.stars+" ★"),cell(r.days+" "+x.days));body.appendChild(tr);
}
function createLevelMenu(entry){
 const x=t(),details=document.createElement("details");details.className="level-menu";
 const summary=document.createElement("summary");summary.textContent=x.levels[entry.level][0];
 const content=document.createElement("div");content.className="level-menu-content";
 const table=document.createElement("table");table.className="data-table";
 const head=document.createElement("thead");head.appendChild(makeHeaders());table.appendChild(head);
 const body=document.createElement("tbody"),solution=bestFor(entry.level);
 if(solution)appendResultRow(body,x.solution,solution.ids);
 appendResultRow(body,x.you,entry.result.ids);table.appendChild(body);
 const wrap=document.createElement("div");wrap.className="table-wrap";wrap.appendChild(table);
 const topTitle=document.createElement("h3");topTitle.textContent=entry.level===0?x.allPlayers:x.top;
 const topTable=document.createElement("table");topTable.className="data-table";
 const topHead=document.createElement("thead");topHead.appendChild(makeHeaders());topTable.appendChild(topHead);
 const topBody=document.createElement("tbody");topBody.id="top-"+entry.level;topTable.appendChild(topBody);
 const topWrap=document.createElement("div");topWrap.className="table-wrap";topWrap.appendChild(topTable);
 content.append(wrap,topTitle,topWrap);details.append(summary,content);return details;
}
function renderOwnSummary(){
 const x=t(),head=$("summaryHead");head.replaceChildren();head.appendChild(makeHeaders());
 const body=$("summaryBody");body.replaceChildren();
 completed.forEach(entry=>{
  const r=entry.result,tr=document.createElement("tr");
  tr.append(cell(x.levels[entry.level][0]),cell(r.ids.map(i=>x.products[i]).join(", ")||x.noProducts,"products-cell"),cell(r.kcal+" "+x.calories),cell(money(r.cents)),cell(r.stars+" ★"),cell(r.days+" "+x.days));body.appendChild(tr);
 });
}
function renderFinalMenus(){const box=$("levelResults");box.replaceChildren();completed.forEach(e=>box.appendChild(createLevelMenu(e)))}
async function loadLeaderboard(){
 try{
  const response=await fetch(SUPABASE_URL+"/rest/v1/leaderboard?select=player,selections,created_at&order=created_at.asc&limit=10000",{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
  if(!response.ok)throw new Error("load");
  const rows=await response.json(),x=t();
  completed.forEach(entry=>{
   const body=$("top-"+entry.level);if(!body)return;body.replaceChildren();const solution=bestFor(entry.level);
   const matches=rows.map(row=>{
    if(!Array.isArray(row.selections))return null;
    const selection=row.selections.find(s=>s.level===entry.level);
    return selection?{row,selection}:null;
   }).filter(Boolean);
   matches.sort((a,b)=>{
    const diff=similarity(b.selection.ids,solution)-similarity(a.selection.ids,solution);
    return Math.abs(diff)>1e-9?diff:new Date(a.row.created_at)-new Date(b.row.created_at);
   });
   const shown=entry.level===0?matches:matches.slice(0,5);
   if(!shown.length){const tr=document.createElement("tr"),td=cell(x.empty);td.colSpan=6;tr.appendChild(td);body.appendChild(tr);return}
   shown.forEach(({row,selection},i)=>appendResultRow(body,entry.level===0?(row.player||x.allPlayers):"#"+(i+1),selection.ids,entry.level===0?"":(row.player||"")));
  });
 }catch(e){$("scoreStatus").textContent=t().loadError}
}
function renderFinal(){ $("finalScreen").hidden=false;renderOwnSummary();renderFinalMenus();loadLeaderboard() }
async function submitResults(){
 const name=$("playerName").value.trim();
 if(!name){$("scoreStatus").textContent=t().enterName;$("playerName").focus();return}
 if(submitted)return;
 const button=$("submitScore");button.disabled=true;$("scoreStatus").textContent=t().saving;
 const selections=completed.map(e=>({level:e.level,ids:e.result.ids}));
 try{
  const response=await fetch(SUPABASE_URL+"/rest/v1/leaderboard",{
   method:"POST",
   headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
   body:JSON.stringify({player:name.slice(0,24),selections})
  });
  if(!response.ok)throw new Error("save");
  submitted=true;$("nameGate").hidden=true;renderFinal();
 }catch(e){button.disabled=false;$("scoreStatus").textContent=t().saveError}
}
function finishLevel(){
 const result=total();if(result.kcal<MIN||result.kcal>MAX)return;
 completed.push({level,result});
 if(level===4){
  $("game").hidden=true;$("actionBar").hidden=true;$("hintFloat").hidden=true;$("hintPopup").hidden=true;$("startScreen").hidden=true;$("nameGate").hidden=false;$("playerName").focus();return;
 }
 level++;selected.clear();renderStart();
}
document.querySelectorAll(".language-buttons button").forEach(button=>button.addEventListener("click",()=>{lang=button.dataset.language;applyLanguage()}));
$("startButton").addEventListener("click",()=>{$("startScreen").hidden=true;$("game").hidden=false;$("actionBar").hidden=false;renderGame()});
$("hintFloat").addEventListener("click",()=>{
 const popup=$("hintPopup");
 if(!popup.hidden){popup.hidden=true;$("hintFloat").setAttribute("aria-expanded","false");return}
 popup.textContent=t().tip+t().levels[level][2]+".";popup.hidden=false;$("hintFloat").setAttribute("aria-expanded","true");
});
$("clearButton").addEventListener("click",()=>{selected.clear();renderProducts();renderSummary()});
$("nextButton").addEventListener("click",finishLevel);
$("submitScore").addEventListener("click",submitResults);
$("playerName").addEventListener("keydown",event=>{if(event.key==="Enter")submitResults()});
applyLanguage();renderStart();
</script>
</body>
</html>
